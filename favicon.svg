<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="capG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="neuralG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgG)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- Neural Brain Hemisphere Arcs & Synapses -->
  <!-- Outer brain contours -->
  <path d="M20 35 C12 40, 13 52, 23 55" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M44 35 C52 40, 51 52, 41 55" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Synapse connections -->
  <g stroke="url(#neuralG)" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="33" x2="32" y2="43" />
    <line x1="32" y1="43" x2="20" y2="39" />
    <line x1="32" y1="43" x2="44" y2="39" />
    <line x1="20" y1="39" x2="24" y2="50" />
    <line x1="44" y1="39" x2="40" y2="50" />
    <line x1="24" y1="50" x2="32" y2="57" />
    <line x1="40" y1="50" x2="32" y2="57" />
    <line x1="32" y1="43" x2="32" y2="57" />
  </g>

  <!-- Neural Nodes (Synapses) -->
  <circle cx="32" cy="43" r="3.2" fill="#fff" filter="url(#glow)"/>
  <circle cx="20" cy="39" r="2.8" fill="#38bdf8"/>
  <circle cx="44" cy="39" r="2.8" fill="#38bdf8"/>
  <circle cx="24" cy="50" r="2.8" fill="#34d399"/>
  <circle cx="40" cy="50" r="2.8" fill="#34d399"/>
  <circle cx="32" cy="57" r="2.6" fill="#6ee7b7"/>

  <!-- Academic Cap Under-rim -->
  <path d="M19 25 C19 33, 45 33, 45 25" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.8" />

  <!-- Academic Cap Rhombus (Mortarboard) -->
  <polygon points="32,9 56,20 32,31 8,20" fill="url(#capG)" filter="url(#glow)"/>
  <polygon points="32,10.5 53,20 32,29.5 11,20" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.6"/>

  <!-- Tassel (Кисточка) -->
  <circle cx="32" cy="20" r="1.8" fill="#facc15"/>
  <path d="M32 20 Q16 19 13 26 L12 34" fill="none" stroke="#facc15" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="34" r="1.8" fill="#facc15"/>
</svg>