<html lang="ru">
<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(11, 17, 32, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 1px solid #38bdf8;
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px;
      display: flex;
      flex-direction: column;
    }

    /* Progress & Stats Bar */
    .status-bar {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .progress-track {
      flex: 1;
      max-width: 380px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Quiz Card */
    .quiz-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      animation: fadeIn 0.3s ease;
    }

    .case-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .situation-box {
      background: rgba(30, 41, 59, 0.6);
      border-left: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 17px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .question-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.35;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .btn-audio-speak {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-audio-speak:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f8fafc;
      font-size: 17px;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(4px);
    }

    .option-letter {
      width: 34px;
      height: 34px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.18) !important;
      border-color: #22c55e !important;
      color: #4ade80 !important;
    }

    .option-btn.correct .option-letter {
      background: #22c55e;
      color: #fff;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.18) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
    }

    .option-btn.wrong .option-letter {
      background: #ef4444;
      color: #fff;
    }

    /* Hints & Explanation */
    .hint-box {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 16px 20px;
      color: #fde68a;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    .explain-box {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 16px;
      padding: 20px 24px;
      color: #dcfce7;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    .explain-title {
      font-size: 17px;
      font-weight: 800;
      color: #4ade80;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .explain-text {
      font-size: 16px;
      line-height: 1.6;
      color: #bbf7d0;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    /* Results Screen */
    .results-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 28px;
      padding: 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }

    .trophy-icon {
      font-size: 64px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    /* Reviewer Slide-over Drawer */
    .reviewer-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: rgba(11, 17, 32, 0.98);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
      z-index: 2000;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
    }

    .reviewer-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .capture-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .capture-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .capture-quote {
      font-size: 13px;
      line-height: 1.4;
      color: #cbd5e1;
      font-style: italic;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid #38bdf8;
    }

    .capture-input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }

    .capture-input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .note-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
    }

    .note-item-delete {
      color: #ef4444;
      cursor: pointer;
    }

    .note-item-text {
      font-size: 13px;
      line-height: 1.4;
      color: #f8fafc;
    }
  </style>

rue}, {"id": "B", "text": "Многократная отправка смайликов с требованием прекратить писать лишние слова.", "correct": false}, {"id": "C", "text": "Уменьшение размера шрифта в браузере преподавателя.", "correct": false}, {"id": "D", "text": "Ограничение скорости интернет-соединения до минимума.", "correct": false}], "hints": ["По умолчанию модели настроены быть максимально вежливыми и услужливыми.", "Прямой запрет экономит полезные токены и избавляет от ручной чистки текста в Word."], "explanation": "Отрицательные ограничения (Exclusions / Anti-prompts) прямо запрещают тратить вычислительные токены на ритуальную вежливость, направляя всё внимание модели на суть задачи."}, {"id": 3, "badge": "Формула RTCE • Целевое действие", "topic": "Формулировка задачи через сильные глаголы", "situation": "Преподаватель написал: «Поговорим о технике безопасности при работе с электроустановками до 1000 В». Модель ответила философскими рассуждениями о важности сохранения жизни человека на производстве.", "question": "В чём заключается грубая ошибка формулировки задачи (Task) в этом промпте?", "options": [{"id": "A", "text": "Задача сформулирована как пассивная беседа («поговорим»), а не как осязаемый результат; нужен сильный глагол: «Разработай 5 производственных кейсов с 4 вариантами ответов и ключом по ПУЭ».", "correct": true}, {"id": "B", "text": "Нейросети принципиально не знают правил техники безопасности.", "correct": false}, {"id": "C", "text": "Слово «электроустановки» является запрещённым цензурным фильтром.", "correct": false}, {"id": "D", "text": "Необходимо было указать фамилию инженера по охране труда учебного заведения.", "correct": false}], "hints": ["Глагол в промпте определяет форму конечного артефакта.", "Размытые глаголы («подумай», «поговорим», «расскажи») всегда порождают водянистые тексты."], "explanation": "Задача в промпте обязана содержать сильный глагол действия: разработай, структурируй, сравни, выдели, оформи в таблицу. Это задаёт чёткий формат выхода."}, {"id": 4, "badge": "Архитектура памяти • Контекстное окно", "topic": "Деградация внимания в длинном чате (Context Rot)", "situation": "Преподаватель непрерывно работает в одном диалоге уже шестой час (реплика № 52). Неожиданно модель перестаёт учитывать заданные в начале критерии ФГОС, путает формулы и повторяет собственные опечатки.", "question": "Какое физическое явление вызвало деградацию качества ответов?", "options": [{"id": "A", "text": "Загрязнение контекстного окна (Context Rot): внимание модели рассеялось по тысячам токенов черновиков и споров, вымыв исходные инструкции.", "correct": true}, {"id": "B", "text": "На серверах компании закончилась оперативная память и модель устала.", "correct": false}, {"id": "C", "text": "В браузере преподавателя перегрелась видеокарта от длительного чтения текста.", "correct": false}, {"id": "D", "text": "Искусственный интеллект обиделся на постоянные придирки пользователя.", "correct": false}], "hints": ["При каждом запросе передаётся вся история переписки от самого первого сообщения.", "Механизм внимания (Attention) делит фиксированные веса между всеми словами в окне."], "explanation": "Context Rot (размытие внимания) возникает при разрастании истории чата: мусорные токены и черновики вытесняют первоначальные правила, заставляя модель путаться."}, {"id": 5, "badge": "Методика правок • Ловушка споров", "topic": "Почему нельзя спорить с моделью в одном окне", "situation": "Модель ошиблась в расчёте эквивалентного сопротивления смешанного соединения резисторов. Преподаватель трижды написал в ответ: «Ты опять ошибся! Пересчитай!», но модель каждый раз выдаёт новый неверный ответ.", "question": "Почему спор в том же диалоге только усугубляет проблему?", "options": [{"id": "A", "text": "История чата наполняется ошибочными вариантами расчёта, и математика внимания опирается на собственные неверные шаги; правильное действие — отредактировать первый запрос или открыть чистый чат.", "correct": true}, {"id": "B", "text": "Модель специально саботирует проверку, если повышать на неё голос.", "correct": false}, {"id": "C", "text": "Слово «пересчитай» блокирует арифметический блок на 10 минут.", "correct": false}, {"id": "D", "text": "Нужно написать претензию в службу технической поддержки провайдера интернета.", "correct": false}], "hints": ["Модель анализирует всю предшествующую историю как контекстную правду.", "Пять неверных расчётов в переписке создают колоссальный статистический перекос в сторону ошибок."], "explanation": "Спор цементирует ошибку в контексте. Профессионал никогда не спорит: он либо редактирует исходную реплику, либо начинает новую сессию с чистого листа."}, {"id": 6, "badge": "Регламент работы • Атомарные сессии", "topic": "Метод промежуточной выжимки (Summarize & Fork)", "situation": "Преподаватель закончил обсуждение и согласование структуры нового лекционного курса (диалог занял 25 сообщений). Теперь необходимо составить комплект проверочных тестов к каждой теме.", "question": "Каков идеальный алгоритм перехода к следующему этапу без потери качества?", "options": [{"id": "A", "text": "Попросить модель сделать структурированную сухую выжимку согласованного плана, скопировать её и начать составление тестов в совершенно новом чистом чате.", "correct": true}, {"id": "B", "text": "Продолжать писать в том же чате до тех пор, пока окно не выдаст ошибку переполнения памяти.", "correct": false}, {"id": "C", "text": "Удалить все предыдущие сообщения по одному вручную.", "correct": false}, {"id": "D", "text": "Распечатать переписку на принтере и отсканировать обратно в компьютер.", "correct": false}], "hints": ["Принцип: «Одна задача — один чистый диалог».", "Техника Summarize & Fork переносит только кристально чистый результат без мусорных черновиков."], "explanation": "Техника промежуточной выжимки (Summarize & Fork) изолирует задачи: в новый диалог попадает только утверждённая структура, обеспечивая стопроцентный фокус внимания модели."}, {"id": 7, "badge": "Архитектура LLM • Природа памяти", "topic": "Иллюзия долговременной памяти диалога", "situation": "Молодой преподаватель уверен: «Языковая модель запоминает наш диалог в своём виртуальном мозге точно так же, как человек помнит разговор с коллегой».", "question": "В чём заключается реальный физический механизм «памяти» в диалоговых окнах?", "options": [{"id": "A", "text": "У модели нет памяти между запросами: при каждой отправке сообщения браузер заново отсылает на сервер всю склеенную историю переписки целиком.", "correct": true}, {"id": "B", "text": "Модель записывает разговор на специальный жёсткий диск в компьютере пользователя.", "correct": false}, {"id": "C", "text": "Нейросеть сохраняет аудиозапись мыслей преподавателя через веб-камеру.", "correct": false}, {"id": "D", "text": "Память модели обновляется один раз в сутки во время перезагрузки серверов.", "correct": false}], "hints": ["Каждый вызов API независим (stateless).", "Память чата — это иллюзия, создаваемая повторной пересылкой всего стека сообщений."], "explanation": "Сервер языковой модели не хранит состояние беседы (stateless). При каждом клике «Отправить» программная среда склеивает всю историю чата в один длинный текст и заново скармливает его модели."}, {"id": 8, "badge": "Внимание трансформеров • Lost in the Middle", "topic": "Эффект потери середины в длинных промптах", "situation": "Преподаватель подготовил подробный промпт на 2 страницы, где в середине текста (на 40-й строчке) указал важнейшее требование: «Все формулы выводить строго в формате LaTeX». Модель проигнорировала это требование и выдала формулы простым текстом.", "question": "Какая особенность архитектуры трансформеров объясняет эту ошибку?", "options": [{"id": "A", "text": "Эффект Lost in the Middle: модели лучше всего считывают начало контекста и его самый конец, систематически теряя детали из середины длинного блока текста.", "correct": true}, {"id": "B", "text": "Модель не умеет читать строки, номер которых делится на 10.", "correct": false}, {"id": "C", "text": "Слово LaTeX было написано строчными буквами, что вызвало системный сбой.", "correct": false}, {"id": "D", "text": "Модели принципиально запрещено выводить математические формулы длиннее 5 символов.", "correct": false}], "hints": ["Паттерн распределения внимания имеет U-образную форму: пики в начале и в конце.", "Критические инструкции и форматы вывода всегда размещают в самом финале промпта."], "explanation": "Исследования внимания (Attention) доказывают: информация из середины длинного контекста вымывается чаще всего. Главные ограничения и форматы вывода обязаны стоять в самом конце запроса."}, {"id": 9, "badge": "Few-Shot промптинг • Сила образца", "topic": "Обучение на примерах без переобучения весов", "situation": "Преподавателю необходимо сгенерировать 30 тестовых заданий со специфической структурой: условие задачи, 4 дистрактора, правильный ответ, пункт ПУЭ и детальный разбор типовой ошибки студента.", "question": "Какой метод промптинга гарантирует соблюдение такой сложной структуры со 100% точностью?", "options": [{"id": "A", "text": "Few-Shot промптинг: поместить в тело запроса 1–2 эталонных образца идеального тестового вопроса с разбором, после чего дать команду продолжить по образцу.", "correct": true}, {"id": "B", "text": "Zero-Shot промптинг: просто написать «составь 30 сложных тестов» без единого примера.", "correct": false}, {"id": "C", "text": "Написать 10 страниц строгих правил с перечислением всех ГОСТов мелким шрифтом.", "correct": false}, {"id": "D", "text": "Попросить модель написать тест на английском языке, а затем перевести обратно.", "correct": false}], "hints": ["Few-Shot означает «обучение на нескольких примерах в контексте».", "Модели в сотни раз легче сымитировать готовый визуальный паттерн, чем следовать абстрактным инструкциям."], "explanation": "Few-Shot — самый надёжный способ фиксации структуры. Достаточно показать 1–2 идеальных образца, и языковая модель воспроизведёт их форму со стопроцентной стабильностью."}, {"id": 10, "badge": "Chain-of-Thought • Логика вычислений", "topic": "Пошаговые рассуждения против прямых догадок", "situation": "При расчёте переходного процесса в RL-цепи модель выдала неверное значение постоянной времени тау при прямом вопросе: «Чему равна постоянная времени цепи с R=10 Ом и L=0.5 Гн?».", "question": "Какая простая модификация промпта кардинально повышает точность физико-математических расчётов?", "options": [{"id": "A", "text": "Активация Chain-of-Thought (CoT): «Давай рассуждать пошагово: запиши исходную формулу, распиши единицы измерения, подставь числа и проверь размерность».", "correct": true}, {"id": "B", "text": "Повторение вопроса десять раз подряд в одном сообщении.", "correct": false}, {"id": "C", "text": "Добавление фразы «Отвечай максимально быстро, не думая».", "correct": false}, {"id": "D", "text": "Перевод значений сопротивления из Омов в киловатты.", "correct": false}], "hints": ["Генерация идёт пословно слева направо: прямой ответ заставляет модель угадывать число до вычислений.", "Промежуточные рассуждения служат для модели внешней оперативной памятью."], "explanation": "Цепочка рассуждений (Chain-of-Thought) заставляет модель проговаривать промежуточные шаги. Это позволяет внутренним весам внимания выполнить вычисления до вывода финального ответа."}, {"id": 11, "badge": "Thinking модели 2026 • Глубокие рассуждения", "topic": "Скрытые цепочки рассуждений (Reasoning)", "situation": "Преподаватель составляет олимпиадные задания повышенной сложности по электродинамике, требующие доказательств и нестандартного синтеза формул.", "question": "Какой класс современных моделей 2026 года наиболее эффективен для таких задач?", "options": [{"id": "A", "text": "Модели глубоких рассуждений (Reasoning / Thinking: o1, R1, GLM-Thinking), которые генерируют скрытые цепочки самопроверки перед выдачей ответа.", "correct": true}, {"id": "B", "text": "Сверхбыстрые мини-модели для мобильных телефонов с нулевой задержкой.", "correct": false}, {"id": "C", "text": "Программы автоматической проверки орфографии в текстовом редакторе.", "correct": false}, {"id": "D", "text": "Генераторы музыкальных треков и шумовых эффектов.", "correct": false}], "hints": ["Новое поколение моделей «думает перед тем, как ответить».", "Они тратят тысячи скрытых токенов на проверку гипотез и поиск логических нестыковок."], "explanation": "Модели класса Reasoning (Thinking) автоматически тратят вычислительные ресурсы на многократную внутреннюю самопроверку гипотез, достигая уровня победителей студенческих олимпиад."}, {"id": 12, "badge": "Мультимодальность • Vision AI", "topic": "Оцифровка аудиторной доски и рукописей", "situation": "После лекции преподаватель сфотографировал доску с длинным рукописным выводом уравнений Максвелла и схематичным рисунком силовых линий.", "question": "Как мультимодальная модель (Gemini Vision / GLM-4V / Claude) помогает быстро подготовить конспект?", "options": [{"id": "A", "text": "Модель оптически распознаёт рукописный почерк, переводит математические формулы в чистый код LaTeX и структурирует текстовые пояснения в Markdown.", "correct": true}, {"id": "B", "text": "Модель стирает мел с физической доски в аудитории через Wi-Fi.", "correct": false}, {"id": "C", "text": "Модель отказывается работать с рукописным текстом, требуя исключительно печатного шрифта ГОСТ.", "correct": false}, {"id": "D", "text": "Модель перекрашивает доску в зелёный цвет для улучшения контрастности фото.", "correct": false}], "hints": ["Современные визуальные энкодеры связывают пиксели изображения с математическими токенами.", "Преподаватель получает готовый код формул для вставки в презентацию за секунды."], "explanation": "Мультимодальное компьютерное зрение (Vision) способно расшифровывать сложнейшие рукописные формулы и графики, мгновенно конвертируя их в цифровой LaTeX и структурированный конспект."}, {"id": 13, "badge": "Мультимодальность • Лабораторный контроль", "topic": "Анализ схем и графиков приборов", "situation": "Студент собра     const SESSION_COUNT = 7;

    // Session State
    let sessionQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let currentAttempts = 0;
    let userHistory = [];
    let isSpeaking = false;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({
        ...q,
        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

    function renderQuestion() {
      stopSpeech();
      currentAttempts = 0;
      const q = sessionQuestions[currentIdx];
      
      // Update progress
      document.getElementById('stepCounter').innerText = `Вопрос ${currentIdx + 1} из ${SESSION_COUNT}`;
      const pct = Math.round((currentIdx / SESSION_COUNT) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('currentScore').innerText = score;

      const root = document.getElementById('cardRoot');
      root.innerHTML = `
        <div class="quiz-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="case-badge">${q.badge}</div>
            <div style="font-size: 14px; color: #94a3b8;">Попытка: <span id="attemptDisplay" style="color: #fff; font-weight: 800;">1</span> из 3</div>
          </div>

          <div class="situation-box">
            💡 <strong>Ситуация:</strong> ${q.situation}
          </div>

          <div class="question-title">
            <span>${q.question}</span>
            <button class="btn-audio-speak" id="speakQBtn" onclick="toggleSpeakQuestion()" title="Озвучить вопрос вслух для удобства">
              🔊 Озвучить
            </button>
          </div>

          <div class="options-grid" id="optionsGrid">
            ${q.options.map((opt, i) => `
              <button class="option-btn" id="opt_${opt.id}" onclick="handleSelect('${opt.id}')">
                <span class="option-letter">${opt.id}</span>
                <span>${opt.text}</span>
              </button>
            `).join('')}
          </div>

          <div id="hintContainer" style="display: none;"></div>
          <div id="explainContainer" style="display: none;"></div>

          <div class="quiz-footer" id="footerActions" style="display: none;">
            <div id="roundResultText" style="font-size: 15px;"></div>
            <button class="btn btn-primary" onclick="handleNextQuestion()" style="padding: 12px 24px;">
              <span>${currentIdx === SESSION_COUNT - 1 ? 'Завершить практикум ★' : 'Следующий кейс →'}</span>
            </button>
          </div>
        </div>
      `;

      markCurrentContext();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        // 100 on attempt 1, 70 on attempt 2, 40 on attempt 3
        const earned = currentAttempts === 1 ? 100 : (currentAttempts === 2 ? 70 : 40);
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

    function showHint(text, hintNum) {
      const box = document.getElementById('hintContainer');
      box.style.display = 'flex';
      box.className = 'hint-box';
      box.innerHTML = `
        <span style="font-size: 24px;">💡</span>
        <div>
          <strong>Подсказка ${hintNum}:</strong> ${text}
        </div>
      `;
    }

    function showExplanation(q, isPassed, earned) {
      const explainBox = document.getElementById('explainContainer');
      explainBox.style.display = 'flex';
      explainBox.className = 'explain-box';
      explainBox.innerHTML = `
        <div class="explain-title">
          <span>${isPassed ? '✓ Верно! Методический разбор:' : '❌ Разбор ситуации:'}</span>
          <button class="btn-audio-speak" id="speakExpBtn" onclick="toggleSpeakExplanation()" title="Озвучить методический разбор">
            🔊 Озвучить разбор
          </button>
        </div>
        <div class="explain-text" id="explainTextContent">
          ${q.explanation}
        </div>
      `;

      // Footer
      const footer = document.getElementById('footerActions');
      footer.style.display = 'flex';
      const roundText = document.getElementById('roundResultText');
      if (isPassed) {
        roundText.innerHTML = `<span style="color: #22c55e; font-weight: 700;">+${earned} баллов</span> (попытка: ${currentAttempts})`;
      } else {
        roundText.innerHTML = `<span style="color: #f87171; font-weight: 700;">0 баллов</span> (использованы все 3 попытки)`;
      }

      userHistory.push({
        badge: q.badge,
        question: q.question,
        earned: earned,
        attempts: currentAttempts,
        passed: isPassed
      });
    }

    function handleNextQuestion() {
      if (currentIdx < SESSION_COUNT - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      stopSpeech();
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('stepCounter').innerText = 'Практикум завершён!';

      const maxScore = SESSION_COUNT * 100;
      const pct = Math.round((score / maxScore) * 100);

      let trophy = '🎓';
      let title = 'Базовый уровень освоения';
      if (pct >= 85) {
        trophy = '🏆';
        title = 'Эксперт инструментов и методов ИИ';
      } else if (pct >= 65) {
        trophy = '⭐';
        title = 'Уверенный преподаватель-практик';
      }

      // Save completion status
      try {
        localStorage.setItem('ai_course_l4_p4_completed', 'true');
      } catch(e) {}

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="results-card">
          <div class="trophy-icon">${trophy}</div>
          <h1 style="font-size: 34px; font-weight: 900; color: #fff;">${title}</h1>
          <p style="font-size: 19px; color: #94a3b8; max-width: 650px; line-height: 1.5;">
            Вы завершили интерактивный практикум Урока 3. Знания агентной архитектуры, цикла ReAct, протокола MCP и безопасности успешно закреплены.
          </p>

          <div style="background: rgba(56, 189, 248, 0.12); border: 2px solid #38bdf8; border-radius: 20px; padding: 20px 40px; margin: 8px 0;">
            <div style="font-size: 48px; font-weight: 900; color: #38bdf8; font-family: 'JetBrains Mono', monospace;">
              ${score} / ${maxScore}
            </div>
            <div style="font-size: 16px; color: #cbd5e1; font-weight: 700;">${pct}% успешных ответов</div>
          </div>

          <div style="width: 100%; max-width: 700px; text-align: left; background: rgba(3, 7, 18, 0.5); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.08);">
            <div style="font-size: 16px; font-weight: 800; color: #38bdf8; margin-bottom: 12px;">📊 Детализация по темам сессии:</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${userHistory.map((h, i) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; font-size: 15px;">
                  <span>${i+1}. <strong>${h.badge}</strong></span>
                  <span style="font-weight: 700; color: ${h.passed ? '#4ade80' : '#f87171'};">
                    ${h.earned} б. (${h.attempts} ${h.attempts===1?'попытка':'попытки'})
                  </span>
                </div>
              `).join('')}
            </div>
          </div>

          <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 12px;">
            <button class="btn btn-primary" onclick="startNewSession()" style="padding: 14px 26px; font-size: 16px;">
              🔄 Пройти другой вариант (7 новых вопросов из банка 18)
            </button>
            <button class="btn" onclick="copyProtocol()" style="padding: 14px 20px;">
              📋 Скопировать протокол
            </button>
            <a href="index.html" class="btn" style="padding: 14px 20px;">
              К программе курса
            </a>
          </div>
        </div>
      `;
    }

    function copyProtocol() {
      let text = '=== ПРОТОКОЛ ТЕСТИРОВАНИЯ: КУРС ПО ИИ (УРОК 3: АРХИТЕКТУРА И MCP) ===\n';
      text += `Итоговый результат: ${score} из ${SESSION_COUNT * 100} баллов\n`;
      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

    // Speech Synthesis
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const qBtn = document.getElementById('speakQBtn');
      if (qBtn) qBtn.innerText = '🔊 Озвучить';
      const expBtn = document.getElementById('speakExpBtn');
      if (expBtn) expBtn.innerText = '🔊 Озвучить разбор';
    }

    function toggleSpeakQuestion() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      const textToSpeak = `${q.situation}. Вопрос: ${q.question}`;
      speakText(textToSpeak, 'speakQBtn');
    }

    function toggleSpeakExplanation() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      speakText(q.explanation, 'speakExpBtn');
    }

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Reviewer Notes Storage & Handling
    const NOTES_STORAGE_KEY = 'ai_course_notes_l4_p4';
    let reviewerNotes = JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY) || '[]');

    function toggleReviewerDrawer() {
      const d = document.getElementById('reviewerDrawer');
      d.classList.toggle('open');
      if (d.classList.contains('open')) {
        markCurrentContext();
        renderNotesList();
        setTimeout(() => document.getElementById('noteInput').focus(), 200);
      }
    }

    function markCurrentContext() {
      const qNum = currentIdx + 1;
      const sNum = currentIdx + 1;
      const slideEl = document.getElementById('captureSlide');
      const timeEl = document.getElementById('captureTime');
      const quoteEl = document.getElementById('captureQuote');
      if (slideEl) slideEl.innerText = `ВОПРОС ${qNum} ИЗ ${SESSION_COUNT}`;
      if (timeEl) timeEl.innerText = `СИТУАЦИЯ ${sNum}`;
      if (sessionQuestions.length > currentIdx && quoteEl) {
        const q = sessionQuestions[currentIdx];
        quoteEl.innerText = `«${q.situation.substring(0, 100)}...»`;
      }
    }

    function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      const note = {
        id: Date.now(),
        slide: `Вопрос ${currentIdx + 1}`,
        time: `Ситуация ${currentIdx + 1}`,
        quote: document.getElementById('captureQuote').innerText,
        text: text,
        timestamp: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
      };

      reviewerNotes.push(note);
      localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(reviewerNotes));
      input.value = '';
      renderNotesList();
      updateNotesBadge();
    }

    function deleteNote(id) {
      reviewerNotes = reviewerNotes.filter(n => n.id !== id);
      localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(reviewerNotes));
      renderNotesList();
      updateNotesBadge();
    }

    function quickTag(tag) {
      const input = document.getElementById('noteInput');
      input.value = `[${tag}] ${input.value}`;
      input.focus();
    }

    function renderNotesList() {
      const list = document.getElementById('notesList');
      if (!list) return;
      if (reviewerNotes.length === 0) {
        list.innerHTML = '<div style="color:#64748b; font-size:13px; text-align:center; padding:20px 0;">Заметок пока нет. Нажмите Enter, чтобы добавить.</div>';
        return;
      }
      list.innerHTML = reviewerNotes.map(n => `
        <div class="note-item">
          <div class="note-item-header">
            <span>${n.slide} • ${n.time}</span>
            <span class="note-item-delete" onclick="deleteNote(${n.id})">✕ Удалить</span>
          </div>
          <div class="note-item-text">${n.text}</div>
        </div>
      `).join('');
    }

    function updateNotesBadge() {
      const badge = document.getElementById('notesBadge');
      if (badge) badge.innerText = reviewerNotes.length;
    }

    function copyNotesMarkdown() {
      if (reviewerNotes.length === 0) {
        alert('Нет заметок для копирования');
        return;
      }
      const md = reviewerNotes.map(n => `- **${n.slide} (${n.time})**: ${n.text}`).join('\n');
      navigator.clipboard.writeText(md).then(() => alert('Заметки скопированы в буфер!'));
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleReviewerDrawer();
      }
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      updateNotesBadge();
    });
  </script>

  <!-- Reviewer Slide-over Drawer -->
  <div class="reviewer-drawer" id="reviewerDrawer">
    <div class="drawer-header">
      <div class="drawer-title">
        <span>🚩</span> Панель рецензента (Замечания к квизу)
      </div>
      <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="toggleReviewerDrawer()">✕</button>
    </div>

    <div class="drawer-body">
      <div class="capture-box">
        <div class="capture-meta">
          <span id="captureSlide">ВОПРОС 1</span>
          <span id="captureTime">СИТУАЦИЯ 1</span>
        </div>
        <div class="capture-quote" id="captureQuote">
          Нажмите кнопку «M» или зафиксируйте замечание к текущему вопросу.
        </div>
        <input type="text" class="capture-input" id="noteInput" placeholder="Что исправить? (Нажмите Enter для сохранения)..." onkeydown="if(event.key === 'Enter') { event.preventDefault(); saveNote(); }">
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-primary" style="flex:1; justify-content:center; background:#0284c7; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:700; cursor:pointer;" onclick="saveNote()">+ Сохранить метку</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Формулировка')">Формулировка</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Озвучка')">Озвучка</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Ответ')">Ответ</button>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size: 13px; font-weight: 700; color: #94a3b8;">Список правок:</span>
        <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; font-size: 11px; padding: 4px 8px; border-radius:6px; cursor:pointer;" onclick="copyNotesMarkdown()">📋 Скопировать для чата</button>
      </div>

      <div class="notes-list" id="notesList">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

</body>
</html>
