      justify-content: space-between;
      align-items: center;

    .progress-fill {

    .btn-audio-speak {

      color: #38bdf8;
      border-radius: 8px;
      padding: 6px 12px;

      font-weight: 700;

      display: inline-flex;
      align-items: center;

    .btn-audio-speak:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;

    .option-btn {

    .option-letter {

      background: rgba(255, 255, 255, 0.08);

      align-items: center;
      justify-content: center;

      font-size: 15px;

оизвольные значения.", "question": "Как правильно составить ТЗ для ИИ при генерации интерактивной лабораторной работы по электротехнике?", "options": [{"id": "A", "text": "Явно задать строгие аналитические уравнения (законы Кирхгофа, формулы делителя напряжения, условие равновесия моста) и потребовать реализации детерминированной расчётной функции на JavaScript.", "correct": true}, {"id": "B", "text": "Попросить нейросеть добавить больше неоновых эффектов и мерцающих индикаторов на холсте.", "correct": false}, {"id": "C", "text": "Использовать только статичные скриншоты схем из бумажного учебника 1980 года.", "correct": false}, {"id": "D", "text": "Поручить студентам угадывать правильные показания приборов без математического расчёта.", "correct": false}], "hints": ["Инженерный симулятор опирается на строгую физико-математическую модель, а не на случайную графику.", "В промпте необходимо зафиксировать зависимости между входными переменными (R1..R4, E) и выходными величинами (I, U)."], "explanation": "Любая университетская виртуальная лаборатория обязана иметь строгое математическое ядро. Преподаватель передаёт нейросети уравнения Кирхгофа и граничные условия, чтобы JS-функция физически корректно рассчитывала токи и напряжения."}, {"id": 3, "badge": "Интерактив • Векторная графика", "topic": "Динамическая SVG-графика против растровых картинок (PNG)", "situation": "На инженерном факультете создают интерактивный тренажёр по гидравлическим системам. Разработчики вставили растровый рисунок PNG насосной станции, из-за чего при масштабировании на 4K-панели линии размылись, а динамически повернуть стрелку манометра оказалось технически невозможно.", "question": "В чём ключевое преимущество динамического формата SVG для интерактивных университетских схем?", "options": [{"id": "A", "text": "SVG строится векторным кодом: линии и текст остаются идеально чёткими при любом масштабе, а координаты стрелок, клапанов и бегущих маркеров легко связываются с JavaScript-переменными.", "c ивление источника и проводников.", "Моделирование аварийных режимов (КЗ, перегрузка) — важнейшая дидактическая часть подготовки инженеров."], "explanation": "Инженерный симулятор должен быть устойчив к экстремальным параметрам. Учёт внутреннего сопротивления источника предотвращает деление на ноль, а симуляция сработки автоматического выключателя наглядно обучает электробезопасности."}, {"id": 5, "badge": "Интерактив • Экономика производства", "topic": "Веб-плеер против рендеринга MP4 при частых правках", "situation": "Кафедра выпустила 16 часов видеолекций в формате MP4. Рецензент из профильного НИИ обнаружил в третьем видео неверный индекс в формуле тензора напряжений и попросил исправить один символ. Видеомонтажёр запросил 4 часа на повторный рендеринг и экспорт всего видеофайла.", "question": "Почему архитектура монолитного интерактивного веб-плеера (Master Player Shell) экономически эффективнее традиционного видеомонтажа?", "options": [{"id": "A", "text": "В веб-плеере контент атомарен: текст формулы хранится в DOM-разметке, а аудио нарезано по шагам. Исправление опечатки занимает 30 секунд в текстовом редакторе без повторного перерендеринга.", "correct": true}, {"id": "B", "text": "Веб-плееры запрещают рецензентам высказывать замечания к качеству конспекта лекций.", "correct": false}, {"id": "C", "text": "Формат MP4 устарел и не поддерживается современными веб-браузерами.", "correct": false}, {"id": "D", "text": "Видеомонтаж требует обязательного согласования в лицензионной палате региона.", "correct": false}], "hints": ["Рендеринг видео высокого разрешения (4K/FullHD) требует огромных вычислительных ресурсов GPU.", "В веб-коде текстовый слой и звук разделены, что обеспечивает нулевую стоимость точечных правок."], "explanation": "Веб-архитектура разделяет представление и медиаданные. Исправление опечатки в формуле сводится к правке одной строки HTML, экономя часы машинного времени и бюджет кафедры."}, {"id": 6, "badge": "Интерактив • Мобильная адаптация", "topic": "Стандарты кроссплатформенного плеера для смартфонов", "situation": "Студенты инженерного потока пытаются повторить материал лекции со смартфонов в транспорте. В плеере ползунок таймлайна вылез за пределы экрана, кнопки навигации перекрыли формулу, а касания пальцем вызывают неконтролируемое масштабирование страницы.", "question": "Какие технические требования к мобильной адаптации заложены в конституцию Master Player Shell?", "options": [{"id": "A", "text": "Резиновый flex-таймлайн (min-width: 0), поддержка touchstart/touchend событий, запрет на всплывание панелей при переходе слайдов и адаптивные стили под экраны от 320px до альбомной ориентации.", "correct": true}, {"id": "B", "text": "Полный запрет на запуск университетских материалов на мобильных устройствах студентов.", "correct": false}, {"id": "C", "text": "Принудительное уменьшение всех шрифтов до 6 пунктов на смартфонах.", "correct": false}, {"id": "D", "text": "Требование открывать плеер исключительно через приложение Госуслуги.", "correct": false}], "hints": ["Мобильный интерфейс требует учёта тач-событий пальцев и гибкой компоновки колонок в вертикальный стек.", "Таймлайн обязан эластично сжиматься без вылета за край экрана."], "explanation": "Master Player Shell включает исчерпывающие правила адаптивности: медиа-запросы перестраивают трёхколоночную вёрстку в удобный вертикальный поток, а тач-события обеспечивают надёжное переключение шагов."}, {"id": 7, "badge": "Агентный QA • Playwright", "topic": "Автономный контроль качества безголовым браузером", "situation": "Преподаватель закончил сборку 4 частей интерактивного занятия. Впереди рутинная приёмка: нужно проверить 20 экранов, нажать каждую кнопку, проверить работу клавиши 'M', таймеры автоскрытия и хоткеи навигации, на что уйдёт не менее 2 часов.", "question": "Как делегировать рутинное тестирование интерактивных лекций субагенту (Browser QA)?", "options": [{"id": "A", "text": "Запустить субагента с Playwright: робот в безголовом Chromium выполнит тест-план, прощёлкает все слайды, проверит горячие клавиши, прослушает консоль и запишет видеосессию .webp.", "correct": true}, {"id": "B", "text": "Поручить тестирование первокурсникам во время практического занятия вместо изучения темы.", "correct": false}, {"id": "C", "text": "Отказаться от тестирования, надеясь, что ошибки исправятся сами собой в процессе эксплуатации.", "correct": false}, {"id": "D", "text": "Распечатать HTML-код плеера на бумаге и вычитывать его с карандашом.", "correct": false}], "hints": ["Автономный браузерный субагент способен за 60 секунд пройти все сценарии взаимодействия в чистом окружении.", "Видеозапись WebP фиксирует экранное подтверждение корректной работы всех элементов."], "explanation": "Браузерные агенты на базе Playwright полностью автоматизируют приёмку: они эмулируют действия пользователя, проверяют обработчики событий и гарантируют работоспособность интерфейса до показа человеку."}, {"id": 8, "badge": "Агентный QA • Чистота консоли", "topic": "Золотой стандарт 0 Console Errors", "situation": "При открытии слайда в браузере визуально всё выглядит нормально, однако в консоли разработчика красным цветом горит ошибка: «Uncaught TypeError: Cannot read properties of undefined (reading 'audioTime')». Плеер играет, но перемотка перестала работать.", "question": "Почему в регламенте курса действует железный запрет на сдачу плеера при наличии хотя бы одной ошибки в консоли?", "options": [{"id": "A", "text": "Скрытые исключения JavaScript блокируют фоновые асинхронные обработчики (таймлайн, автопереход, сохранение заметок) и неизбежно вызывают отказ плеера на устройствах студентов.", "correct": true}, {"id": "B", "text": "Консольные ошибки увеличивают расход электроэнергии кафедрального сервера в два раза.", "correct": false}, {"id": "C", "text": "Браузер автоматически отправляет штраф разработчику при обнаружении любой ошибки.", "correct": false}, {"id": "D", "text": "Ошибки в консоли видны студентам прямо поверх титульного слайда кафедры", "topic": "Культура контрольных точек (Savepoints)", "situation": "Молодой ассистент кафедры в течение месяца вносил правки в методические материалы и презентации к лабораторным работам. В один день файл был повреждён вирусом или сбоем диска, и все правки за месяц оказались безвозвратно утрачены.", "question": "Как культура атомарных коммитов в Git решает проблему сохранности кафедрального учебно-методического фонда?", "options": [{"id": "A", "text": "Каждое осмысленное изменение (утверждение сценария, генерация звука, обновление схем) фиксируется как несгораемая контрольная точка с понятным комментарием и полной историей правок.", "correct": true}, {"id": "B", "text": "Git автоматически переписывает методичку в соответствии с требованиями ВАК.", "correct": false}, {"id": "C", "text": "Система контроля версий шифрует файлы паролем, недоступным заведующему кафедрой.", "correct": false}, {"id": "D", "text": "Коммиты в Git заменяют собой проведение сессии и выставление оценок.", "correct": false}], "hints": ["Принцип сейвпоинта: преподаватель в любой момент может вернуться к состоянию любой даты.", "История коммитов отражает пошаговую эволюцию образовательного контента."], "explanation": "Git превращает кафедральные материалы в прозрачный версионируемый репозиторий. Каждый коммит фиксирует состояние учебных пособий, исключая потерю наработок и позволяя отследить авторство каждой правки."}, {"id": 11, "badge": "Git-безопасность • Ликвидация галлюцинаций", "topic": "Мгновенный откат (git restore / reset)", "situation": "Нейросеть при редактировании слайда по квантовой механике допустила галлюцинацию: удалила фундаментальные волновые уравнения Шрёдингера и заменила их псевдонаучным рассуждением на 50 строк. Преподаватель обнаружил подмену.", "question": "Какое стандартное действие в Git позволяет мгновенно нейтрализовать последствия галлюцинации нейросети?", "options": [{"id": "A", "text": "Выполнить команду отката (git restore / git checkout), которая за одну секунду восстановит исходный академически выверенный файл из последнего коммита без потерь.", "correct": true}, {"id": "B", "text": "Вручную перепечатывать удалённые формулы по памяти с риском допустить новые ошибки.", "correct": false}, {"id": "C", "text": "Согласиться с галлюцинацией и включить псевдонаучные тезисы в экзаменационные билеты.", "correct": false}, {"id": "D", "text": "Удалить весь репозиторий проекта и начать писать курс с нуля.", "correct": false}], "hints": ["Команда restore возвращает рабочий каталог в точное состояние зафиксированной контрольной точки.", "Преподаватель не тратит часы на ручное восстановление текста."], "explanation": "Возможность мгновенного отката даёт преподавателю психологическую уверенность: если агент испортит сложный математический вывод, команда git restore вернёт стабильную версию за доли секунды."}, {"id": 12, "badge": "Архитектура ИИ • Изоляция памяти", "topic": "Оркестратор и фоновые субагенты-воркеры (Anti-Context Rot)", "situation": "Преподаватель работает с нейросетью над 16-часовым курсом в одном диалоговом окне. Через неделю диалог начал тормозить, модель стала забывать вводные правила кафедры, путать термины и выгружать в чат простыни технического мусора.", "question": "Как двухзвенная архитектура «Оркестратор — Субагенты» решает проблему деградации контекста (Context Rot)?", "options": [{"id": "A", "text": "Главный агент в чате выступает координатором и методистом, а вся тяжёлая техническая рутина (FFmpeg, синтез, Playwright) делегируется фоновым воркерам с чистой памятью, возвращающим лишь краткий отчёт.", "correct": true}, {"id": "B", "text": "Преподаватель должен каждый день создавать новую учётную запись у провайдера нейросети.", "correct": false}, {"id": "C", "text": "Запрещается обсуждать с моделью темы объёмом более одной печатной страницы.", "correct": false}, {"id": "D", "text": "Все сценарии лекций сокращаются до 3 коротких предложений.", "correct": false}], "hints": ["Переполнение контекстного окна лога тервалы моргания, саккады взгляда и легкие наклоны головы, снимая напряжение и создавая ощущение живого диалога с лектором."}, {"id": 18, "badge": "Этика ИИ • Защита личности", "topic": "Правовые и этические нормы использования цифровых аватаров лектора", "situation": "Руководство университета решило использовать фотопортрет и сгенерированный голос профессора кафедры для создания коммерческого онлайн-курса без его ведома и письменного согласия.", "question": "Каковы обязательные этические и технические стандарты использования цифровых двойников преподавателей в высшей школе?", "options": [{"id": "A", "text": "Обязательное письменное согласие преподавателя на клонирование голоса и внешности, маркировка сгенерированного контента цифровыми водяными знаками (SynthID) и явное уведомление студентов о работе с ИИ-аватаром.", "correct": true}, {"id": "B", "text": "Сгенерированные аватары считаются общественным достоянием и могут использоваться кем угодно без ограничений.", "correct": false}, {"id": "C", "text": "Запрещено сообщать студентам, что перед ними выступает цифровой аватар, чтобы не снижать дисциплину.", "correct": false}, {"id": "D", "text": "Все права на голос и лицо преподавателя автоматически переходят разработчикам нейросети.", "correct": false}], "hints": ["Биометрические данные (голос, лицо) охраняются законодательством о персональных данных и интеллектуальной собственности.", "Технологии цифровой маркировки (SynthID, C2PA) подтверждают этичное происхождение медиафайла."], "explanation": "Этика генеративного образования требует абсолютной прозрачности: согласие правообладателя на синтез, цифровая маркировка SynthID для защиты от дипфейков и информирование студентов об использовании цифрового двойника."}];
    const SESSION_COUNT = 7;

    // Session State
    let sessionQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let currentAttempts = 0;
    let userHistory = [];
    let isSpeaking = false;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({
        ...q,
        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

    function renderQuestion() {
      stopSpeech();
      currentAttempts = 0;
      const q = sessionQuestions[currentIdx];
      
      // Update progress
      document.getElementById('stepCounter').innerText = `Вопрос ${currentIdx + 1} из ${SESSION_COUNT}`;
      const pct = Math.round((currentIdx / SESSION_COUNT) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('currentScore').innerText = score;

      const root = document.getElementById('cardRoot');
      root.innerHTML = `
        <div class="quiz-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="case-badge">${q.badge}</div>
            <div style="font-size: 14px; color: #94a3b8;">Попытка: <span id="attemptDisplay" style="color: #fff; font-weight: 800;">1</span> из 3</div>
          </div>

          <div class="situation-box">
            💡 <strong>Ситуация:</strong> ${q.situation}
          </div>

          <div class="question-title">
            <span>${q.question}</span>
            <button class="btn-audio-speak" id="speakQBtn" onclick="toggleSpeakQuestion()" title="Озвучить вопрос вслух для удобства">
              🔊 Озвучить
            </button>
          </div>

          <div class="options-grid" id="optionsGrid">
            ${q.options.map((opt, i) => `
              <button class="option-btn" id="opt_${opt.id}" onclick="handleSelect('${opt.id}')">
                <span class="option-letter">${opt.id}</span>
                <span>${opt.text}</span>
              </button>
            `).join('')}
          </div>

          <div id="hintContainer" style="display: none;"></div>
          <div id="explainContainer" style="display: none;"></div>

          <div class="quiz-footer" id="footerActions" style="display: none;">
            <div id="roundResultText" style="font-size: 15px;"></div>
            <button class="btn btn-primary" onclick="handleNextQuestion()" style="padding: 12px 24px;">
              <span>${currentIdx === SESSION_COUNT - 1 ? 'Завершить практикум ★' : 'Следующий кейс →'}</span>
            </button>
          </div>
        </div>
      `;

      // // markCurrentContext();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        let earned = 3; if (currentAttempts === 2) earned = 2; if (currentAttempts >= 3) earned = 1;
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

    function showHint(text, hintNum) {
      const box = document.getElementById('hintContainer');
      box.style.display = 'flex';
      box.className = 'hint-box';
      box.innerHTML = `
        <span style="font-size: 24px;">💡</span>
        <div>
          <strong>Подсказка ${hintNum}:</strong> ${text}
        </div>
      `;
    }

    function showExplanation(q, isPassed, earned) {
      const explainBox = document.getElementById('explainContainer');
      explainBox.style.display = 'flex';
      explainBox.className = 'explain-box';
      explainBox.innerHTML = `
        <div class="explain-title">
          <span>${isPassed ? '✓ Верно! Методический разбор:' : '❌ Разбор ситуации:'}</span>
          <button class="btn-audio-speak" id="speakExpBtn" onclick="toggleSpeakExplanation()" title="Озвучить методический разбор">
            🔊 Озвучить разбор
          </button>
        </div>
        <div class="explain-text" id="explainTextContent">
          ${q.explanation}
        </div>
      `;

      // Footer
      const footer = document.getElementById('footerActions');
      footer.style.display = 'flex';
      const roundText = document.getElementById('roundResultText');
      if (isPassed) {
        const suffix = earned === 1 ? '\u0431\u0430\u043B\u043B' : '\u0431\u0430\u043B\u043B\u0430'; roundText.innerHTML = `<span style="color: #22c55e; font-weight: 700;">+${earned} ${suffix}</span> (\u043F\u043E\u043F\u044B\u0442\u043A\u0430: ${currentAttempts})`;
      } else {
        roundText.innerHTML = `<span style="color: #f87171; font-weight: 700;">0 баллов</span> (использованы все 3 попытки)`;
      }

      userHistory.push({
        badge: q.badge,
        question: q.question,
        earned: earned,
        attempts: currentAttempts,
        passed: isPassed
      });
    }

    function handleNextQuestion() {
      if (currentIdx < SESSION_COUNT - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      stopSpeech();
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('stepCounter').innerText = 'Практикум завершён!';

      const maxScore = SESSION_COUNT * 3;
      const pct = Math.round((score / maxScore) * 100);

      let trophy = '🎓';
      let title = 'Базовый уровень освоения';
      if (pct >= 85) {
        trophy = '🏆';
        title = 'Эксперт инструментов и методов ИИ';
      } else if (pct >= 65) {
        trophy = '⭐';
        title = 'Уверенный преподаватель-практик';
      }

      // Save completion status
      try {
        localStorage.setItem('ai_course_l7_p4_completed', 'true');
      } catch(e) {}

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="results-card">
          <div class="trophy-icon">${trophy}</div>
          <h1 style="font-size: 34px; font-weight: 900; color: #fff;">${title}</h1>
          <p style="font-size: 19px; color: #94a3b8; max-width: 650px; line-height: 1.5;">
            Вы завершили интерактивный практикум Урока 7. Компетенции создания интерактивных веб-лабораторий, агентного контроля качества (Playwright QA), Git-безопасности, атомарного синтеза речи и внедрения видео-аватаров успешно закреплены.
          </p>

          <div style="background: rgba(56, 189, 248, 0.12); border: 2px solid #38bdf8; border-radius: 20px; padding: 20px 40px; margin: 8px 0;">
            <div style="font-size: 48px; font-weight: 900; color: #38bdf8; font-family: 'JetBrains Mono', monospace;">
              ${score} / ${maxScore}
            </div>
            <div style="font-size: 16px; color: #cbd5e1; font-weight: 700;">${pct}% успешных ответов</div>
          </div>

          <div style="width: 100%; max-width: 700px; text-align: left; background: rgba(3, 7, 18, 0.5); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.08);">
            <div style="font-size: 16px; font-weight: 800; color: #38bdf8; margin-bottom: 12px;">📊 Детализация по темам сессии:</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${userHistory.map((h, i) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; font-size: 15px;">
                  <span>${i+1}. <strong>${h.badge}</strong></span>
                  <span style="font-weight: 700; color: ${h.passed ? '#4ade80' : '#f87171'};">
                    ${h.earned} б. (${h.attempts} ${h.attempts===1?'попытка':'попытки'})
                  </span>
                </div>
              `).join('')}
            </div>
          </div>

          <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 12px;">
            <button class="btn btn-primary" onclick="startNewSession()" style="padding: 14px 26px; font-size: 16px;">
              🔄 Пройти другой вариант (7 новых вопросов из банка 18)
            </button>
            <button class="btn" onclick="copyProtocol()" style="padding: 14px 20px;">
              📋 Скопировать протокол
            </button>
            <a href="index.html" class="btn" style="padding: 14px 20px;">
              К программе курса
            </a>
          </div>
        </div>
      `;
    }

    function copyProtocol() {
      let text = '=== ПРОТОКОЛ ТЕСТИРОВАНИЯ: КУРС ПО ИИ (УРОК 7: ИНТЕРАКТИВ, ГОЛОС И ВИДЕО — МУЛЬТИМЕДИА) ===\n';
      text += `Итоговый результат: ${score} из ${SESSION_COUNT * 3} баллов\n`;
      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

    // Speech Synthesis
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const qBtn = document.getElementById('speakQBtn');
      if (qBtn) qBtn.innerText = '🔊 Озвучить';
      const expBtn = document.getElementById('speakExpBtn');
      if (expBtn) expBtn.innerText = '🔊 Озвучить разбор';
    }

    function toggleSpeakQuestion() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      const textToSpeak = `${q.situation}. Вопрос: ${q.question}`;
      speakText(textToSpeak, 'speakQBtn');
    }

    function toggleSpeakExplanation() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      speakText(q.explanation, 'speakExpBtn');
    }

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleReviewerDrawer() {}
    function markCurrentContext() {}
    window.addEventListener('keydown', (e) => {
      
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      // // updateNotesBadge();
    });
  </script>
</body>
</html>
