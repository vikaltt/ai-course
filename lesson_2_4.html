<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лекция 2. Часть 4: Интерактивный практикум и тест</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(11, 17, 32, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 1px solid #38bdf8;
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px;
      display: flex;
      flex-direction: column;
    }

    /* Progress & Stats Bar */
    .status-bar {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .progress-track {
      flex: 1;
      max-width: 380px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Quiz Card */
    .quiz-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      animation: fadeIn 0.3s ease;
    }

    .case-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .situation-box {
      background: rgba(30, 41, 59, 0.6);
      border-left: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 17px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .question-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.35;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .btn-audio-speak {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-audio-speak:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f8fafc;
      font-size: 17px;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(4px);
    }

    .option-letter {
      width: 34px;
      height: 34px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.18) !important;
      border-color: #22c55e !important;
      color: #4ade80 !important;
    }

    .option-btn.correct .option-letter {
      background: #22c55e;
      color: #fff;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.18) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
    }

    .option-btn.wrong .option-letter {
      background: #ef4444;
      color: #fff;
    }

    /* Hints & Explanation */
    .hint-box {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 16px 20px;
      color: #fde68a;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    .explain-box {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 16px;
      padding: 20px 24px;
      color: #dcfce7;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    .explain-title {
      font-size: 17px;
      font-weight: 800;
      color: #4ade80;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .explain-text {
      font-size: 16px;
      line-height: 1.6;
      color: #bbf7d0;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    /* Results Screen */
    .results-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 28px;
      padding: 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }

    .trophy-icon {
      font-size: 64px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .capture-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .capture-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .capture-quote {
      font-size: 13px;
      line-height: 1.4;
      color: #cbd5e1;
      font-style: italic;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid #38bdf8;
    }

    .capture-input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }

    .capture-input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .note-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
    }

    .note-item-delete {
      color: #ef4444;
      cursor: pointer;
    }

    .note-item-text {
      font-size: 13px;
      line-height: 1.4;
      color: #f8fafc;
    }
  
    @media (max-width: 640px) {
      header {
        padding: 10px 14px !important;
      }
      .header-title {
        font-size: 13px !important;
        max-width: 55vw !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      main {
        padding: 14px 12px 40px !important;
      }
      .status-bar {
        flex-direction: column !important;
        gap: 12px !important;
        align-items: stretch !important;
        padding: 12px 14px !important;
      }
      .progress-track {
        max-width: 100% !important;
        margin: 0 !important;
      }
      .quiz-card {
        padding: 20px 14px !important;
        border-radius: 18px !important;
        gap: 16px !important;
      }
      .situation-box {
        font-size: 15px !important;
        padding: 12px 14px !important;
      }
      .question-title {
        font-size: 16px !important;
        flex-direction: column !important;
        align-items: flex-start !important;
      }
      .option-btn {
        padding: 12px 14px !important;
        font-size: 13px !important;
      }
    }

          /* =========================================================================
       MOBILE PORTRAIT: SINGLE-CARD FULLSCREEN & RESPONSIVE AUTO-FORMATTING
       ========================================================================= */
    @media (max-width: 768px) and (orientation: portrait), (max-width: 600px) {
      body {
        height: 100dvh !important;
      }
      .header-title-text, .nav-tabs {
        display: none !important;
      }
      .canvas-container {
        padding: 6px 6px 4px 6px !important;
        width: 100% !important;
        height: auto !important;
        flex: 1 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        justify-content: flex-start !important;
        min-height: 0 !important;
        box-sizing: border-box !important;
      }
      .slide-viewport {
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        flex: 1 !important;
        min-height: 0 !important;
        border-radius: 14px !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        display: flex !important;
        flex-direction: column !important;
        box-shadow: none !important;
        position: relative !important;
      }
      .slide-canvas {
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        padding: 14px 12px 12px 12px !important;
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
        min-height: 0 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        background: #080e1e !important;
      }
      .bg-glow-1, .bg-glow-2 {
        display: none !important;
      }
      #slide-root {
        width: 100% !important;
        height: 100% !important;
        flex: 1 !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
      }

      /* Slide Header & Title */
      .slide-header {
        margin-bottom: 6px !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        flex-shrink: 0 !important;
      }
      .slide-header .badge-group {
        display: flex !important;
        gap: 6px !important;
        align-items: center !important;
      }
      .slide-header .badge {
        font-size: 10px !important;
        padding: 3px 8px !important;
        border-radius: 6px !important;
        letter-spacing: 0.3px !important;
      }
      .slide-header .slide-counter {
        font-size: 11px !important;
        font-weight: 700 !important;
        color: #64748b !important;
      }
      .title-block {
        margin-bottom: 8px !important;
        flex-shrink: 0 !important;
      }
      .slide-title {
        font-size: 17px !important;
        font-weight: 800 !important;
        line-height: 1.22 !important;
        margin-bottom: 3px !important;
        color: #ffffff !important;
      }
      .slide-subtitle {
        font-size: 12px !important;
        font-weight: 500 !important;
        line-height: 1.3 !important;
        color: #94a3b8 !important;
        display: -webkit-box !important;
        -webkit-line-clamp: 2 !important;
        -webkit-box-orient: vertical !important;
        overflow: hidden !important;
      }

      /* Slide Body: Flex Column Container */
      .slide-body {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        gap: 0 !important;
      }

      /* Multi-Column Card Row Transparency in Mobile */
      .card-row {
        display: contents !important;
      }

      /* Single-Card Focus: Hide All Non-Highlighted Cards */
      .slide-body > .glass-card:not(.highlighted),
      .card-row > .glass-card:not(.highlighted) {
        display: none !important;
      }

      /* Single-Card Focus: Expand the Active Highlighted Card */
      .slide-body > .glass-card.highlighted,
      .card-row > .glass-card.highlighted {
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        flex: 1 !important;
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        padding: 16px 14px !important;
        border-radius: 16px !important;
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.25) !important;
        transform: none !important;
        visibility: visible !important;
        opacity: 1 !important;
        box-sizing: border-box !important;
        overflow-y: auto !important;
      }

      /* Formatting Inside Active Card: Proportional & Full Fields */
      .slide-body > .glass-card.highlighted > div:first-child,
      .card-row > .glass-card.highlighted > div:first-child {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
      }
      .slide-body > .glass-card.highlighted > div:first-child > div:first-child,
      .card-row > .glass-card.highlighted > div:first-child > div:first-child {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        margin-bottom: 10px !important;
      }
      .slide-body > .glass-card.highlighted > div:first-child > div:first-child span:first-child,
      .card-row > .glass-card.highlighted > div:first-child > div:first-child span:first-child {
        font-size: 32px !important;
        line-height: 1 !important;
      }
      .slide-body > .glass-card.highlighted > div:first-child > div:first-child span:last-child,
      .card-row > .glass-card.highlighted > div:first-child > div:first-child span:last-child {
        font-size: 11px !important;
        padding: 3px 8px !important;
        border-radius: 6px !important;
        font-weight: 700 !important;
        letter-spacing: 0.4px !important;
        text-transform: uppercase !important;
      }
      .slide-body > .glass-card.highlighted h2,
      .card-row > .glass-card.highlighted h2,
      .slide-body > .glass-card.highlighted h3,
      .card-row > .glass-card.highlighted h3 {
        font-size: 20px !important;
        font-weight: 800 !important;
        line-height: 1.25 !important;
        margin-bottom: 10px !important;
        color: #ffffff !important;
      }
      .slide-body > .glass-card.highlighted p,
      .card-row > .glass-card.highlighted p {
        font-size: 14.5px !important;
        line-height: 1.45 !important;
        color: #cbd5e1 !important;
        margin-bottom: 12px !important;
      }
      .slide-body > .glass-card.highlighted div[style*="border-radius: 14px"],
      .card-row > .glass-card.highlighted div[style*="border-radius: 14px"],
      .slide-body > .glass-card.highlighted div[style*="padding: 14px 18px"],
      .card-row > .glass-card.highlighted div[style*="padding: 14px 18px"],
      .card-row > .glass-card.highlighted div[style*="display: flex; flex-direction: column; gap: 10px"] > div,
      .card-row > .glass-card.highlighted div[style*="display: flex; flex-direction: column; gap: 12px"] > div {
        padding: 10px 12px !important;
        border-radius: 10px !important;
        margin-bottom: 8px !important;
        background: rgba(255, 255, 255, 0.04) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
      }
      .slide-body > .glass-card.highlighted > div:last-child,
      .card-row > .glass-card.highlighted > div:last-child {
        margin-top: auto !important;
        padding: 10px 12px !important;
        border-radius: 10px !important;
        font-size: 13px !important;
        font-weight: 700 !important;
        line-height: 1.35 !important;
        flex-shrink: 0 !important;
      }

      /* Step 0 Hero Teaser Mobile Layout (Supports #slide-root > .glass-card & .slide-inner > .glass-card) */
      .slide-inner {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
        height: 100% !important;
        min-height: 0 !important;
        overflow: hidden !important;
      }
      #slide-root > .glass-card,
      .slide-inner > .glass-card {
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        flex: 1 !important;
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        padding: 14px 12px !important;
        border-radius: 14px !important;
        overflow-y: auto !important;
        box-sizing: border-box !important;
      }
      #slide-root > .glass-card > div:first-child,
      .slide-inner > .glass-card > div:first-child {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
      }

      /* Concept Badge / Category */
      #slide-root > .glass-card div[style*="letter-spacing"],
      .slide-inner > .glass-card div[style*="letter-spacing"],
      #slide-root > .glass-card div[style*="text-transform: uppercase"],
      .slide-inner > .glass-card div[style*="text-transform: uppercase"] {
        font-size: 10.5px !important;
        font-weight: 800 !important;
        margin-bottom: 6px !important;
        letter-spacing: 0.5px !important;
      }

      /* Concept Title H2 */
      #slide-root > .glass-card h2,
      .slide-inner > .glass-card h2 {
        font-size: 17px !important;
        font-weight: 800 !important;
        line-height: 1.25 !important;
        margin-bottom: 8px !important;
        color: #ffffff !important;
      }

      /* Concept Subtitle / Description P */
      #slide-root > .glass-card p,
      .slide-inner > .glass-card p {
        font-size: 13px !important;
        line-height: 1.4 !important;
        color: #cbd5e1 !important;
        margin-bottom: 8px !important;
      }

      /* Step 0 Hero Teasers (Lessons 2-4, 6-8): Hide redundant duplicate inner header (category, title, badge) */
      #slide-root > .glass-card > div:first-child > div[style*="justify-content: space-between"],
      .slide-inner > .glass-card > div:first-child > div[style*="justify-content: space-between"],
      #slide-root > .glass-card > div:first-child > div:first-child,
      .slide-inner > .glass-card > div:first-child > div:first-child {
        display: none !important;
      }

      /* Step 0 Prompter quote teaser styling on mobile */
      #slide-root > .glass-card div[style*="border-left"],
      .slide-inner > .glass-card div[style*="border-left"] {
        font-size: 15px !important;
        line-height: 1.5 !important;
        margin-bottom: 14px !important;
        padding-left: 14px !important;
        border-left-width: 3px !important;
        font-weight: 500 !important;
        color: #f1f5f9 !important;
      }

      /* Step 0 Bottom Insight / Key Takeaway banner on mobile */
      #slide-root > .glass-card div[style*="border: 1px dashed"],
      .slide-inner > .glass-card div[style*="border: 1px dashed"],
      #slide-root > .glass-card div[style*="dashed"],
      .slide-inner > .glass-card div[style*="dashed"],
      #slide-root > .glass-card div[style*="background: #38bdf815"],
      .slide-inner > .glass-card div[style*="background: #38bdf815"] {

    const SESSION_COUNT = 7;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({
        ...q,
        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

    function renderQuestion() {
      stopSpeech();
      currentAttempts = 0;
      const q = sessionQuestions[currentIdx];
      
      // Update progress
      document.getElementById('stepCounter').innerText = `Вопрос ${currentIdx + 1} из ${SESSION_COUNT}`;
      const pct = Math.round((currentIdx / SESSION_COUNT) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('currentScore').innerText = score;

      const root = document.getElementById('cardRoot');
      root.innerHTML = `
        <div class="quiz-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="case-badge">${q.badge}</div>
            <div style="font-size: 14px; color: #94a3b8;">Попытка: <span id="attemptDisplay" style="color: #fff; font-weight: 800;">1</span> из 3</div>

          <div class="situation-box">
            💡 <strong>Ситуация:</strong> ${q.situation}

          <div class="question-title">

            </button>
          </div>
        </div>
      `;

      // // markCurrentContext();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        let earned = 3; if (currentAttempts === 2) earned = 2; if (currentAttempts >= 3) earned = 1;
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

      const explainBox = document.getElementById('explainContainer');

      explainBox.style.padding = '14px 20px';
      const suffix = earned === 1 ? '\u0431\u0430\u043B\u043B' : '\u0431\u0430\u043B\u043B\u0430';
      explainBox.innerHTML = `

      if (roundText) roundText.style.display = 'none';

      userHistory.push({
        badge: q.badge,
        question: q.question,
        earned: earned,
        attempts: currentAttempts,
        passed: isPassed
      });
    }

      if (currentIdx < SESSION_COUNT - 1) {

      let text = '=== ПРОТОКОЛ ТЕСТИРОВАНИЯ: КУРС ПО ИИ (УРОК 2) ===\n';

      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

    // Speech Synthesis
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const qBtn = document.getElementById('speakQBtn');
      if (qBtn) qBtn.innerText = '🔊 Озвучить';
      const expBtn = document.getElementById('speakExpBtn');
      if (expBtn) expBtn.innerText = '🔊 Озвучить разбор';
    }

    function toggleSpeakQuestion() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      const textToSpeak = `${q.situation}. Вопрос: ${q.question}`;
      speakText(textToSpeak, 'speakQBtn');
    }

    function toggleSpeakExplanation() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      speakText(q.explanation, 'speakExpBtn');
    }

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleReviewerDrawer() {}
    function markCurrentContext() {}
    window.addEventListener('keydown', (e) => {
      
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      // // updateNotesBadge();
    });
  </script>
  <script src="assets/glossary_tooltips.js" defer></script>
</body>
</html>
