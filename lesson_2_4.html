лов (OCR).", "correct": false}], "hints": ["Задача обратна озвучке: нужно превратить аудиоволну в текст и понять, кто именно сейчас говорит.", "Диаризация — это процесс маркировки «кто когда сказал» (лектор vs студент)."], "explanation": "Перевод живой речи в текст называется ASR (Automatic Speech Recognition). Разделение звуковой дорожки по голосам разных участников называется диаризацией (Diarization)."}, {"id": 3, "badge": "Типология задач • Рекомендательные алгоритмы", "topic": "Адаптивные образовательные траектории", "situation": "Онлайн-платформа университета анализирует ошибки студента в тестах по электротехнике и автоматически предлагает ему индивидуальную подборку коротких видеороликов и задач разного уровня сложности.", "question": "Какой алгоритмический принцип лежит в основе этой системы?", "options": [{"id": "A", "text": "Коллаборативная фильтрация и рекомендательные модели на основе графов знаний.", "correct": true}, {"id": "B", "text": "Случайный выбор материалов из общего архива вуза.", "correct": false}, {"id": "C", "text": "Генерация текста с нуля без учёта предыдущих ответов учащегося.", "correct": false}, {"id": "D", "text": "Жесткий линейный переход от 1-й главы к 10-й без ветвлений.", "correct": false}], "hints": ["Система сравнивает профиль ошибок студента с похожими профилями тысяч других учащихся.", "По такому же принципу работают умные ленты академических публикаций и обучающих курсов."], "explanation": "Адаптивное обучение строится на рекомендательных системах (Recommender Systems). Алгоритм сопоставляет текущие пробелы учащегося с графом учебных компетенций и рекомендует оптимальный следующий шаг."}, {"id": 4, "badge": "Типология задач • Предиктивная аналитика", "topic": "Прогнозирование успеваемости и отсева", "situation": "Деканат загружает в систему статистику посещаемости, сдачи лабораторных работ и баллов за первые 4 недели семестра, чтобы заранее выявить студентов из группы академического риска.", "question": "Какую математическую задачу решает предиктивная модель ИИ в этом сценарии?", "options": [{"id": "A", "text": "Бинарную классификацию вероятности отчисления (риск: да/нет) или регрессию итогового балла.", "correct": true}, {"id": "B", "text": "Генерацию стихов об учебе для поднятия настроения студентов.", "correct": false}, {"id": "C", "text": "Синтез аудиозаписи поздравления с успешной сдачей сессии.", "correct": false}, {"id": "D", "text": "Архивацию базы данных в zip-архив.", "correct": false}], "hints": ["Предиктивный ИИ отвечает на вопрос: «Что скорее всего произойдёт в будущем на основе закономерностей прошлого?».", "Модель предсказывает вероятность события на основе табличных числовых данных."], "explanation": "Прогнозирование отсева — классическая задача контролируемого машинного обучения (Supervised ML: классификация вероятности риска или регрессия числового балла на экзамене)."}, {"id": 5, "badge": "Типология задач • Генеративный бум", "topic": "Генерация против распознавания", "situation": "Преподаватель сравнивает работу шахматной программы 1997 года (Deep Blue) и современной генеративной модели (GPT-4 / Claude).", "question": "В чём качественный водораздел генеративного ИИ по сравнению с классическими аналитическими системами?", "options": [{"id": "A", "text": "Генеративный ИИ синтезирует новые связные объекты (текст, код, схемы), а не только выбирает лучший вариант из заданного списка.", "correct": true}, {"id": "B", "text": "Генеративный ИИ никогда не ошибается, в отличие от шахматных программ.", "correct": false}, {"id": "C", "text": "Генеративные модели не требуют серверов и работают на солнечных батареях.", "correct": false}, {"id": "D", "text": "Классические программы не способны производить математические вычисления.", "correct": false}], "hints": ["Deep Blue искал лучший ход среди миллионов возможных. Языковая модель пишет с нуля авторский рассказ или скрипт.", "Ключевое слово — создание принципиально нового контента на основе усвоенных законов языка."], "explanation": "Генеративный ИИ (Generative AI) совершил переход от задач дискриминации (сортировка, распознавание, поиск оптимума) к задачам синтеза качественно новых текстов, изображений и программного кода."}, {"id": 6, "badge": "Типология задач • Матрица задач педагога", "topic": "Зона ответственности человека и ИИ", "situation": "Кафедра составляет регламент использования нейросетей при разработке рабочих программ дисциплин (РПД).", "question": "Какую часть работы методически грамотно делегировать ИИ, а какую обязан оставить за собой преподаватель?", "options": [{"id": "A", "text": "ИИ — черновики формулировок компетенций, списки тем и примеры; Человек — проверка стандартов, утверждение логики и критериев оценки.", "correct": true}, {"id": "B", "text": "ИИ полностью формирует РПД и сразу отправляет в министерство без проверки преподавателя.", "correct": false}, {"id": "C", "text": "Преподаватель пишет всё вручную, а нейросеть только ставит электронную подпись.", "correct": false}, {"id": "D", "text": "ИИ используется исключительно для перевода методички на иностранные языки.", "correct": false}], "hints": ["Принцип «Человек в контуре» (Human-in-the-loop): черновая рутина автоматизируется, ответственность за качество остаётся за экспертом.", "Педагогический замысел и валидация фактуры не могут быть отданы машине."], "explanation": "ИИ ускоряет сборку черновика в 3–5 раз, генерируя варианты и форматируя таблицы. Но юридическая, академическая и смысловая ответственность всегда лежит на преподавателе-эксперте."}, {"id": 7, "badge": "Анатомия ошибок • Механизм галлюцинаций", "topic": "Статистическая природа автодополнения", "situation": "Нейросеть сгенерировала биографию ученого-физика. Текст звучит солидно и научно, но содержит выдуманный номер патента и несуществующую монографию 1974 года.", "question": "Какова истинная техническая причина этой ошибки?", "options": [{"id": "A", "text": "Модель максимизирует правдоподобие фразы по статистике языка, не имея физического доступа к проверке фактов в реальности.", "correct": true}, {"id": "B", "text": "В дата-центре провайдера произошел перегрев оперативной памяти видеокарты.", "correct": false}, {"id": "C", "text": "Алгоритм специально соврал, чтобы проверить внимательность преподавателя.", "correct": false}, {"id": "D", "text": "Нейросеть подключилась к засекреченной базе данных спецслужб.", "correct": false}], "hints": ["Нейросеть не хранит Википедию в виде архива файлов; она рассчитывает вероятности следующего слога (токена).", "Для математики модели истинный факт и убедительный вымысел формируются одним и тем же уравнением."], "explanation": "Языковая модель — статистический генератор следующего токена. Она знает структуру научной библиографии (Автор, Название, Издательство, Год) и собирает правдоподобно звучащую строку, не проверяя существование книги."}, {"id": 8, "badge": "Анатомия ошибок • Психологическая ловушка", "topic": "Уверенный академический тон", "situation": "Преподаватель читает ответ нейросети на сложный физический вопрос. Формулировки безупречны, логические связки идеальны, но в расчете закона Ома перепутаны числитель и знаменатель.", "question": "Почему человеку особенно трудно заметить фактическую ошибку в ответах современных LLM?", "options": [{"id": "A", "text": "Высокая стилистическая грамотность и уверенный тон усыпляют критическое восприятие человека (эффект ореола экспертности).", "correct": true}, {"id": "B", "text": "Нейросети используют гипнотические частоты при отображении букв на мониторе.", "correct": false}, {"id": "C", "text": "Ошибки в формулах физически невозможно обнаружить без суперкомпьютера.", "correct": false}, {"id": "D", "text": "Текст нейросети стирается из памяти читателя через 10 секунд.", "correct": false}], "hints": ["Люди привыкли: если собеседник говорит без запинки и академическим языком — он эксперт. С ИИ это правило не работает.", "Форма ответа идеальна, а содержание может содержать грубую ошибку."], "explanation": "Ловушка уверенного тона: человеческий мозг связывает беглость речи и грамотность с компетентностью. LLM всегда звучат на 100% уверенно, даже когда транслируют полную бессмыслицу."}, {"id": 9, "badge": "Правила фактчекинга • Принцип нулевого доверия", "topic": "Критические зоны проверки", "situation": "Преподаватель подготовил с помощью ИИ конспект лекции по материаловедению на 15 страниц.", "question": "К каким элементам сгенерированного материала педагог обязан применить «принцип нулевого доверия» и сверить по первоисточникам?", "options": [{"id": "A", "text": "К точным числовым константам, номерам ГОСТов, формулам, цитатам и историческим датам.", "correct": true}, {"id": "B", "text": "Только к вводным словам и расстановке знаков препинания.", "correct": false}, {"id": "C", "text": "К цвету шрифта заголовков в документе.", "correct": false}, {"id": "D", "text": "Ни к чему, современные платные модели никогда не ошибаются в точных науках.", "correct": false}], "hints": ["Именно точные данные (числа, стандарты, артикулы, фамилии) чаще всего подвергаются вероятностному искажению.", "Общий смысл абзаца обычно верен, но конкретная цифра в формуле может быть сгенерирована наугад."], "explanation": "Принцип нулевого доверия: любые формулы, ГОСТы, числовые коэффициенты и цитаты в обязательном порядке верифицируются экспертом по официальным справочникам и стандартам."}, {"id": 10, "badge": "Ограничения данных • Garbage In, Garbage Out", "topic": "Зависимость качества от датасета", "situation": "Для помощи первокурсникам в вузе настроили модель, обученную на немодерируемых студенческих форумах за последние 10 лет.", "question": "С каким фундаментальным ограничением машинного обучения столкнется эта система?", "options": [{"id": "A", "text": "«Мусор на входе — мусор на выходе» (GIGO): модель впитает и будет уверенно воспроизводить студенческие заблуждения и мифы.", "correct": true}, {"id": "B", "text": "Модель откажется отвечать на русском языке.", "correct": false}, {"id": "C", "text": "Сервер сгорит от переизбытка неформальной лексики.", "correct": false}, {"id": "D", "text": "Система начнет требовать стипендию от ректората.", "correct": false}], "hints": ["Модель — это зеркало данных, на которых она обучалась.", "Если в учебных текстах содержались фактические ошибки, алгоритм закрепит их как норму."], "explanation": "Принцип GIGO (Garbage In, Garbage Out): нейросеть не обладает врождённым чувством истины. Если обучающая выборка содержит предвзятость, ошибки или слухи, модель неизбежно экстраполирует их в ответах."}, {"id": 11, "badge": "Безопасность и право • Федеральный закон 152-ФЗ", "topic": "Защита персональных данных студентов", "situation": "Преподаватель решил сэкономить время и загрузил в публичный бесплатный чат-бот Excel-файл с ФИО студентов, паспортными данными и результатами экзаменов для сортировки.", "question": "Какую грубую правовую и этическую ошибку совершил преподаватель?", "options": [{"id": "A", "text": "Нарушил закон 152-ФЗ «О персональных данных», передав конфиденциальные сведения на сторонние серверы без согласия субъектов.", "correct": true}, {"id": "B", "text": "Слишком быстро выполнил работу деканата.", "correct": false}, {"id": "C", "text": "Не перевел фамилии студентов на английский язык.", "correct": false}, {"id": "D", "text": "Использовал формат .xlsx вместо .csv.", "correct": false}], "hints": ["Публичные облачные сервисы сохраняют историю запросов и могут использовать её для дообучения моделей.", "Персональные данные (ФИО + оценки/паспорта) защищены федеральным законодательством РФ."], "explanation": "Загрузка реальных персональных данных учащихся в публичные облачные чаты является прямым нарушением 152-ФЗ. Для анализа данных требуется обязательная анонимизация («Студент 1», «Студент 2»)."}, {"id": 12, "badge": "Практика фактчекинга • Метод перекрёстной проверки", "topic": "Инструменты выявления галлюцинаций", "situation": "Преподаватель сомневается в достоверности сложного математического доказательства, выданного нейросе     const SESSION_COUNT = 7;

    // Session State
    let sessionQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let currentAttempts = 0;
    let userHistory = [];
    let isSpeaking = false;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({
        ...q,
        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

    function renderQuestion() {
      stopSpeech();
      currentAttempts = 0;
      const q = sessionQuestions[currentIdx];
      
      // Update progress
      document.getElementById('stepCounter').innerText = `Вопрос ${currentIdx + 1} из ${SESSION_COUNT}`;
      const pct = Math.round((currentIdx / SESSION_COUNT) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('currentScore').innerText = score;

      const root = document.getElementById('cardRoot');
      root.innerHTML = `
        <div class="quiz-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="case-badge">${q.badge}</div>
            <div style="font-size: 14px; color: #94a3b8;">Попытка: <span id="attemptDisplay" style="color: #fff; font-weight: 800;">1</span> из 3</div>
          </div>

          <div class="situation-box">
            💡 <strong>Ситуация:</strong> ${q.situation}
          </div>

          <div class="question-title">
            <span>${q.question}</span>
            <button class="btn-audio-speak" id="speakQBtn" onclick="toggleSpeakQuestion()" title="Озвучить вопрос вслух для удобства">
              🔊 Озвучить
            </button>
          </div>

          <div class="options-grid" id="optionsGrid">
            ${q.options.map((opt, i) => `
              <button class="option-btn" id="opt_${opt.id}" onclick="handleSelect('${opt.id}')">

                <span>${opt.text}</span>
              </button>
            `).join('')}
          </div>

          <div id="hintContainer" style="display: none;"></div>
          <div id="explainContainer" style="display: none;"></div>

          <div class="quiz-footer" id="footerActions" style="display: none;">
            <div id="roundResultText" style="font-size: 15px;"></div>
            <button class="btn btn-primary" onclick="handleNextQuestion()" style="padding: 12px 24px;">
              <span>${currentIdx === SESSION_COUNT - 1 ? 'Завершить практикум ★' : 'Следующий кейс →'}</span>
            </button>
          </div>
        </div>
      `;

      markCurrentContext();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        // 100 on attempt 1, 70 on attempt 2, 40 on attempt 3
        const earned = currentAttempts === 1 ? 100 : (currentAttempts === 2 ? 70 : 40);
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

    function showHint(text, hintNum) {
      const box = document.getElementById('hintContainer');
      box.style.display = 'flex';
      box.className = 'hint-box';
      box.innerHTML = `
        <span style="font-size: 24px;">💡</span>
        <div>
          <strong>Подсказка ${hintNum}:</strong> ${text}
        </div>
      `;
    }

    function showExplanation(q, isPassed, earned) {
      const explainBox = document.getElementById('explainContainer');
      explainBox.style.display = 'flex';
      explainBox.className = 'explain-box';
      explainBox.innerHTML = `
        <div class="explain-title">
          <span>${isPassed ? '✓ Верно! Методический разбор:' : '❌ Разбор ситуации:'}</span>
          <button class="btn-audio-speak" id="speakExpBtn" onclick="toggleSpeakExplanation()" title="Озвучить методический разбор">
            🔊 Озвучить разбор
          </button>
        </div>
        <div class="explain-text" id="explainTextContent">
          ${q.explanation}
        </div>
      `;

      // Footer
      const footer = document.getElementById('footerActions');
      footer.style.display = 'flex';
      const roundText = document.getElementById('roundResultText');
      if (isPassed) {
        roundText.innerHTML = `<span style="color: #22c55e; font-weight: 700;">+${earned} баллов</span> (попытка: ${currentAttempts})`;
      } else {
        roundText.innerHTML = `<span style="color: #f87171; font-weight: 700;">0 баллов</span> (использованы все 3 попытки)`;
      }

      userHistory.push({
        badge: q.badge,
        question: q.question,
        earned: earned,
        attempts: currentAttempts,
        passed: isPassed
      });
    }

    function handleNextQuestion() {
      if (currentIdx < SESSION_COUNT - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      stopSpeech();
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('stepCounter').innerText = 'Практикум завершён!';

      const maxScore = SESSION_COUNT * 100;

      const container = document.getElementById('appContainer');
      container.innerHTML = `

              ${score} / ${maxScore}

            <div style="font-size: 16px; font-weight: 800; color: #38bdf8; margin-bottom: 12px;">📊 Детализация по темам сессии:</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${userHistory.map((h, i) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; font-size: 15px;">
                  <span>${i+1}. <strong>${h.badge}</strong></span>

                    ${h.earned} б. (${h.attempts} ${h.attempts===1?'попытка':'попытки'})
                  </span>

            </div>

            </a>
          </div>
        </div>

    function copyProtocol() {
      let text = '=== ПРОТОКОЛ ТЕСТИРОВАНИЯ: КУРС ПО ИИ (УРОК 2) ===\n';
      text += `Итоговый результат: ${score} из ${SESSION_COUNT * 100} баллов\n`;
      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

      if ('speechSynthesis' in window) {

      }
      const q = sessionQuestions[currentIdx];
      speakText(q.explanation, 'speakExpBtn');
    }

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Reviewer Notes Storage & Handling
    const NOTES_STORAGE_KEY = 'ai_course_notes_l2_p4';
    let reviewerNotes = JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY) || '[]');

    function toggleReviewerDrawer() {
      const d = document.getElementById('reviewerDrawer');
      d.classList.toggle('open');
      if (d.classList.contains('open')) {
        markCurrentContext();
        renderNotesList();
        setTimeout(() => document.getElementById('noteInput').focus(), 200);
      }
    }

    function markCurrentContext() {
      const qNum = currentIdx + 1;
      const sNum = currentIdx + 1;
      const slideEl = document.getElementById('captureSlide');
      const timeEl = document.getElementById('captureTime');
      const quoteEl = document.getElementById('captureQuote');
      if (slideEl) slideEl.innerText = `ВОПРОС ${qNum} ИЗ ${SESSION_COUNT}`;
      if (timeEl) timeEl.innerText = `СИТУАЦИЯ ${sNum}`;
      if (sessionQuestions.length > currentIdx && quoteEl) {
        const q = sessionQuestions[currentIdx];
        quoteEl.innerText = `«${q.situation.substring(0, 100)}...»`;
      }
    }

    function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      const note = {
        id: Date.now(),
        slide: `Вопрос ${currentIdx + 1}`,
        time: `Ситуация ${currentIdx + 1}`,
        quote: document.getElementById('captureQuote').innerText,
        text: text,
        timestamp: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
      };

      reviewerNotes.push(note);
      localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(reviewerNotes));
      input.value = '';
      renderNotesList();
      updateNotesBadge();
    }

    function deleteNote(id) {
      reviewerNotes = reviewerNotes.filter(n => n.id !== id);
      localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(reviewerNotes));
      renderNotesList();
      updateNotesBadge();
    }

    function quickTag(tag) {
      const input = document.getElementById('noteInput');
      input.value = `[${tag}] ${input.value}`;
      input.focus();
    }

    function renderNotesList() {
      const list = document.getElementById('notesList');
      if (!list) return;
      if (reviewerNotes.length === 0) {
        list.innerHTML = '<div style="color:#64748b; font-size:13px; text-align:center; padding:20px 0;">Заметок пока нет. Нажмите Enter, чтобы добавить.</div>';
        return;
      }
      list.innerHTML = reviewerNotes.map(n => `
        <div class="note-item">
          <div class="note-item-header">
            <span>${n.slide} • ${n.time}</span>
            <span class="note-item-delete" onclick="deleteNote(${n.id})">✕ Удалить</span>
          </div>
          <div class="note-item-text">${n.text}</div>
        </div>
      `).join('');
    }

    function updateNotesBadge() {
      const badge = document.getElementById('notesBadge');
      if (badge) badge.innerText = reviewerNotes.length;
    }

    function copyNotesMarkdown() {
      if (reviewerNotes.length === 0) {
        alert('Нет заметок для копирования');
        return;
      }
      const md = reviewerNotes.map(n => `- **${n.slide} (${n.time})**: ${n.text}`).join('\n');
      navigator.clipboard.writeText(md).then(() => alert('Заметки скопированы в буфер!'));
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleReviewerDrawer();
      }
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      updateNotesBadge();
    });
  </script>

  <!-- Reviewer Slide-over Drawer -->
  <div class="reviewer-drawer" id="reviewerDrawer">
    <div class="drawer-header">
      <div class="drawer-title">
        <span>🚩</span> Панель рецензента (Замечания к квизу)
      </div>
      <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="toggleReviewerDrawer()">✕</button>
    </div>

    <div class="drawer-body">
      <div class="capture-box">
        <div class="capture-meta">
          <span id="captureSlide">ВОПРОС 1</span>
          <span id="captureTime">СИТУАЦИЯ 1</span>
        </div>
        <div class="capture-quote" id="captureQuote">
          Нажмите кнопку «M» или зафиксируйте замечание к текущему вопросу.
        </div>
        <input type="text" class="capture-input" id="noteInput" placeholder="Что исправить? (Нажмите Enter для сохранения)..." onkeydown="if(event.key === 'Enter') { event.preventDefault(); saveNote(); }">
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-primary" style="flex:1; justify-content:center; background:#0284c7; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:700; cursor:pointer;" onclick="saveNote()">+ Сохранить метку</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Формулировка')">Формулировка</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Озвучка')">Озвучка</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Ответ')">Ответ</button>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size: 13px; font-weight: 700; color: #94a3b8;">Список правок:</span>
        <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; font-size: 11px; padding: 4px 8px; border-radius:6px; cursor:pointer;" onclick="copyNotesMarkdown()">📋 Скопировать для чата</button>
      </div>

      <div class="notes-list" id="notesList">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

</body>
</html>
