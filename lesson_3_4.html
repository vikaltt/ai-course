      justify-content: space-between;
      align-items: center;

      flex: 1;

      height: 8px;
      background: rgba(255, 255, 255, 0.1);

ер является лишь тонким терминалом отображения; вся математика с триллионами параметров считается на удалённых кластерах GPU в дата-центре.", "correct": true}, {"id": "B", "text": "Модель использует скрытые возможности процессора ноутбука в спящем режиме.", "correct": false}, {"id": "C", "text": "Генерация текста не требует математических вычислений и основана на мгновенном поиске в словаре.", "correct": false}, {"id": "D", "text": "Ноутбук преподавателя передал нагрузку по Wi-Fi на соседний монитор.", "correct": false}], "hints": ["Ваш ноутбук отправляет только текстовые символы запроса и принимает входящий поток токенов.", "Перемножение сотен миллиардов весовых коэффициентов происходит на серверах мощностью в десятки мегаватт."], "explanation": "Браузер пользователя выполняет роль тонкого клиента. Все вычисления матричной алгебры выполняются на специализированных серверных ускорителях (NVIDIA H100/B200 или TPU) в облачных дата-центрах."}, {"id": 3, "badge": "Триада агента • Роль «Мозга»", "topic": "Истинная функция языковой модели", "situation": "Студент утверждает: «Языковая модель внутри агента сама компилирует программу на C++, запускает сервер и тестирует сайт в Google Chrome».", "question": "В чём заключается принципиальная ошибка в понимании роли языковой модели?", "options": [{"id": "A", "text": "Модель — это только семантическое ядро и генератор рассуждений; она не исполняет код сама, а лишь формирует команды вызова внешних инструментов (Tool Calls).", "correct": true}, {"id": "B", "text": "Модель умеет компилировать только программы на Python, но не на C++.", "correct": false}, {"id": "C", "text": "Модель исполняет код только ночью, когда дата-центры свободны от нагрузки.", "correct": false}, {"id": "D", "text": "Студент абсолютно прав: современные LLM содержат встроенные компиляторы всех языков мира.", "correct": false}], "hints": ["Языковая модель принимает текст и возвращает текст (или JSON-структуру команды).", "Физическое исполнение скриптов и запуск  "A", "text": "Для проектирования — флагманские reasoning-модели (Claude Fable, GPT-6, DeepSeek R1); для рутинной нарезки — скоростные Flash-модели (GLM-4-Flash, DeepSeek Flash).", "correct": true}, {"id": "B", "text": "Использовать самую дорогую модель для нарезки текстов, а проектирование поручить чат-боту 2022 года.", "correct": false}, {"id": "C", "text": "Все задачи без исключения решать только через локальную модель на офисном процессоре без видеокарты.", "correct": false}, {"id": "D", "text": "Использовать исключительно графические нейросети для генерации картинок.", "correct": false}], "hints": ["Сложная декомпозиция требует глубоких цепочек рассуждений (Reasoning tokens).", "Рутинные массовые операции требуют минимальной задержки (Latency) и околонулевой стоимости токенов."], "explanation": "Инженерная грамотность заключается в калибровке: флагманы с глубоким мышлением применяются там, где критична логика; молниеносные экономичные модели — для пакетной рутины."}, {"id": 6, "badge": "Агентская среда • Анатомия Harness", "topic": "Что такое агентский Harness?", "situation": "В технической документации автономного помощника указано: «Модель работает внутри агентского ха́рнесса с поддержкой bash-терминала, fs-операций и браузерного драйвера».", "question": "Какую ключевую роль выполняет Harness в агентской системе?", "options": [{"id": "A", "text": "Служит программным мостом и рабочим столом: перехватывает текстовые намерения модели, выполняет команды в ОС, изолирует ошибки и возвращает результаты.", "correct": true}, {"id": "B", "text": "Занимается охлаждением процессора и видеокарты при пиковых нагрузках.", "correct": false}, {"id": "C", "text": "Проверяет орфографию в ответах преподавателя перед отправкой студентам.", "correct": false}, {"id": "D", "text": "Служит веб-браузером исключительно для просмотра видеороликов.", "correct": false}], "hints": ["Ха́рнесс — это «цифровое тело» и рабочий инструментарий, в котором запертая модель оживает.", "Именно он запускает PowerShell, читает диск C: и открывает страницы в Playwright."], "explanation": "Harness (обвязка среды) превращает языковую модель в агента: он валидирует вызовы инструментов, управляет файловой системой, консолью и процессами, обеспечивая безопасное выполнение задач."}, {"id": 7, "badge": "Инструменты 2026 • Экосистема Harness", "topic": "Профессиональные агентские среды", "situation": "Преподаватель программирования хочет автоматизировать проверку лабораторных работ студентов прямо в репозитории Git на локальном компьютере.", "question": "Какие из перечисленных сред относятся к профессиональным агентским ха́рнессам 2026 года?", "options": [{"id": "A", "text": "Claude Code, Cursor, Windsurf, Antigravity, OpenHands.", "correct": true}, {"id": "B", "text": "Microsoft Word 2003, Paint, Блокнот Windows.", "correct": false}, {"id": "C", "text": "WinRAR, Adobe Acrobat Reader, Калькулятор.", "correct": false}, {"id": "D", "text": "Программы для дефрагментации жёсткого диска.", "correct": false}], "hints": ["Эти среды умеют самостоятельно читать структуру каталогов, искать код через grep, редактировать файлы и тестировать сборку.", "Их интерфейсы оптимизированы под сквозное решение инженерных задач."], "explanation": "Современные агентские среды (Claude Code, Cursor, Antigravity и др.) предоставляют модели полноценный инструментарий разработчика: контекстный поиск, запуск терминала и контроль версий."}, {"id": 8, "badge": "Безопасность среды • Human-in-the-Loop", "topic": "Песочница и супервизия действий", "situation": "Автономный агент в процессе рефакторинга кода лекции сформировал команду `git clean -fdx` и удаление каталога `backup/`.", "question": "Как должен отреагировать правильно настроенный агентский Harness согласно принципам безопасности?", "options": [{"id": "A", "text": "Заблокировать автоматическое выполнение потенциально опасной операции и запросить физическое подтверждение у преподавателя.", "correct": true}, {"id": "B", "text": "Немедленно удалить все файлы и перезагрузить компьютер без предупреждения.", "correct": false}, {"id": "C", "text": "Отправить удалённые файлы личным сообщением ректору университета.", "correct": false}, {"id": "D", "text": "Удалить операционную систему Windows для ускорения работы.", "correct": false}], "hints": ["Принцип «Песочницы» (Sandbox) и контроль деструктивных команд.", "Человек всегда остаётся высшим арбитром и контролёром в критических операциях."], "explanation": "Профессиональный Harness обязан изолировать опасные действия (удаление данных, форматирование, выход во внешние сети) и требовать подтверждения человека (Human-in-the-loop)."}, {"id": 9, "badge": "Оснащение агента • Скиллы vs Инструменты", "topic": "Разделение регламентов и исполнения", "situation": "Методист создал файл `SKILL.md`, в котором подробно описал: «Каждая лекция курса должна состоять строго из 4 частей, включать тизер шага 0 и тренажёр 18/7».", "question": "К какому элементу агентской системы относится этот файл и чем он отличается от инструмента (Tool)?", "options": [{"id": "A", "text": "Это Скилл (знание стандартов и методический регламент в Markdown), в то время как Инструмент — это выполняемый программный код (Python/Playwright).", "correct": true}, {"id": "B", "text": "Это исполняемый драйвер видеокарты, который компилирует шейдеры интерфейса.", "correct": false}, {"id": "C", "text": "Это база данных всех оценок студентов за последние 5 лет.", "correct": false}, {"id": "D", "text": "Между скиллом и инструментом нет никакой разницы, это синонимы.", "correct": false}], "hints": ["Скилл знает «КАК правильно делать по стандарту» (инструкция).", "Инструмент «ДЕЛАЕТ физическую операцию» (код на диске)."], "explanation": "Скиллы (Skills) — это декларативные знания, должностные инструкции и регламенты в текстовом виде. Инструменты (Tools) — это программные исполнительные механизмы с кодом."}, {"id": 10, "badge": "Практика триады • Синергия компонентов", "topic": "Конвейер создания учебного модуля", "situation": "Преподаватель поручает агенту собрать интерактивный тренажёр. В процессе задействованы: регламент «Банк 18 / Выдача 7», модель Claude и утилита Playwright.", "question": "Как распределяются роли участников в этой агентской триаде?", "options": [{"id": "A", "text": "Скилл задаёт методические правила, Модель сочиняет вопросы и дистракторы, Инструмент сохраняет HTML и тестирует плеер в браузере.", "correct": true}, {"id": "B", "text": "Playwright сочиняет стихи, Модель удаляет файлы, а Скилл перезагружает сервер.", "correct": false}, {"id": "C", "text": "Модель пишет регламент, а преподаватель вручную тестирует верстку в консоли 5 часов.", "correct": false}, {"id": "D", "text": "Скилл генерирует звук, а браузер проверяет орфографию диктора.", "correct": false}], "hints": ["Скилл = стандарт качества. Мозг = генерация контента и кода. Инструмент = сохранение и автоматический QA.", "Каждый компонент строго выполняет свою специализированную функцию."], "explanation": "Идеальная синергия: Скилл даёт рамку и правила проверки, Мозг генерирует смысловое наполнение, а Инструменты сохраняют файл на диск и проводят сквозное тестирование в браузере."}, {"id": 11, "badge": "Стандарт MCP • Проблема M×N", "topic": "Зачем индустрии понадобился Model Context Protocol?", "situation": "До 2024 года, чтобы подключить базу данных PostgreSQL к 5 разным моделям в 4 средах разработки, требовалось писать и поддерживать 20 уникальных закрытых плагинов.", "question": "Какую фундаментальную проблему решает открытый протокол MCP?", "options": [{"id": "A", "text": "Заменяет зоопарк спагетти-интеграций единым открытым стандартом: один MCP-сервер ресурса работает сразу с любыми моделями и средами (USB-C для ИИ).", "correct": true}, {"id": "B", "text": "Делает все базы данных в мире бесплатными для коммерческих компаний.", "correct": false}, {"id": "C", "text": "Запрещает использование языка SQL во всех университетах.", "correct": false}, {"id": "D", "text": "Удаляет необходимость использования видеокарт в серверных центрах.", "correct": false}], "hints": ["Вспомните аналогию с кабелем USB-C: раньше под каждый телефон была своя зарядка, теперь порт один.", "MCP делит систему на универсальный Хост-клиент и независимые Серверы ресурсов."], "explanation": "Протокол MCP (Model Context Protocol) решил проблему сложности M×N: вместо написания сотен кастомных адаптеров разработчик пишет один легковесный MCP-сервер, совместимый с любым MCP-клиентом."}, {"id": 12, "badge": "Архитектура MCP • Роли участников", "topic": "Хост, Клиент и Сервер", "situation": "Преподаватель настроил подключение локальной базы тестов к редактору Cursor через протокол MCP.", "question": "Что в этой конфигурации выступает MCP-хостом/клиентом, а что — MCP-сервером?", "options": [{"id": "A", "text": "Cursor — это MCP Host и Client (управляет интерфейсом и безопасностью); скрипт доступа к базе — это MCP Server (поставщик данных и инструментов).", "correct": true}, {"id": "B", "text": "База данных — это Host, а редактор Cursor — пассивный сервер без прав доступа.", "correct": false}, {"id": "C", "text": "Монитор преподавателя — это Server, а процессор — Client.", "correct": false}, {"id": "D", "text": "Все компоненты объединяются в монолитную программу без разделения ролей.", "correct": false}], "hints": ["Host — приложение, где работает пользователь (IDE, CLI).", "Server — изолированный процесс, открывающий доступ к конкретному ресурсу (файлы, БД, API)."], "explanation": "MCP Host/Client (среда разработки) координирует работу, передаёт контекст в LLM и контролирует права. MCP Server изолирует доступ к ресурсу и публикует свои методы через протокол JSON-RPC."}, {"id": 13, "badge": "Транспорты MCP • Связь процессов", "topic": "Транспорт stdio против SSE/HTTP", "situation": "Преподаватель подключает MCP-сервер для работы с файлами на своём рабочем ноутбуке.", "question": "Какой транспортный протокол MCP является стандартным и наиболее безопасным для локального использования на одном ПК?", "o     const SESSION_COUNT = 7;

    // Session State

    let score = 0;
    let currentAttempts = 0;
    let userHistory = [];
    let isSpeaking = false;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({
        ...q,
        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

    function renderQuestion() {
      stopSpeech();
      currentAttempts = 0;
      const q = sessionQuestions[currentIdx];
      
      // Update progress
      document.getElementById('stepCounter').innerText = `Вопрос ${currentIdx + 1} из ${SESSION_COUNT}`;
      const pct = Math.round((currentIdx / SESSION_COUNT) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('currentScore').innerText = score;

      const root = document.getElementById('cardRoot');
      root.innerHTML = `
        <div class="quiz-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="case-badge">${q.badge}</div>

          <div class="situation-box">

          <div class="question-title">

            <button class="btn btn-primary" onclick="handleNextQuestion()" style="padding: 12px 24px;">
              <span>${currentIdx === SESSION_COUNT - 1 ? 'Завершить практикум ★' : 'Следующий кейс →'}</span>
            </button>
          </div>
        </div>
      `;

      markCurrentContext();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        // 100 on attempt 1, 70 on attempt 2, 40 on attempt 3
        const earned = currentAttempts === 1 ? 100 : (currentAttempts === 2 ? 70 : 40);
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

    function showHint(text, hintNum) {
      const box = document.getElementById('hintContainer');
      box.style.display = 'flex';

      box.innerHTML = `

      explainBox.className = 'explain-box';
      explainBox.innerHTML = `

      if (isPassed) {
        roundText.innerHTML = `<span style="color: #22c55e; font-weight: 700;">+${earned} баллов</span> (попытка: ${currentAttempts})`;
      } else {
        roundText.innerHTML = `<span style="color: #f87171; font-weight: 700;">0 баллов</span> (использованы все 3 попытки)`;
      }

      userHistory.push({
        badge: q.badge,

    function handleNextQuestion() {
      if (currentIdx < SESSION_COUNT - 1) {
        currentIdx++;

      stopSpeech();
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('stepCounter').innerText = 'Практикум завершён!';

                  <span>${i+1}. <strong>${h.badge}</strong></span>

                  </span>

    function copyProtocol() {
      let text = '=== ПРОТОКОЛ ТЕСТИРОВАНИЯ: КУРС ПО ИИ (УРОК 3: АРХИТЕКТУРА И MCP) ===\n';
      text += `Итоговый результат: ${score} из ${SESSION_COUNT * 100} баллов\n`;
      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

      if ('speechSynthesis' in window) {

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Reviewer Notes Storage & Handling
    const NOTES_STORAGE_KEY = 'ai_course_notes_l3_p4';
    let reviewerNotes = JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY) || '[]');

    function toggleReviewerDrawer() {
      const d = document.getElementById('reviewerDrawer');
      d.classList.toggle('open');
      if (d.classList.contains('open')) {
        markCurrentContext();
        renderNotesList();
        setTimeout(() => document.getElementById('noteInput').focus(), 200);
      }
    }

    function markCurrentContext() {
      const qNum = currentIdx + 1;
      const sNum = currentIdx + 1;
      const slideEl = document.getElementById('captureSlide');
      const timeEl = document.getElementById('captureTime');
      const quoteEl = document.getElementById('captureQuote');
      if (slideEl) slideEl.innerText = `ВОПРОС ${qNum} ИЗ ${SESSION_COUNT}`;
      if (timeEl) timeEl.innerText = `СИТУАЦИЯ ${sNum}`;
      if (sessionQuestions.length > currentIdx && quoteEl) {
        const q = sessionQuestions[currentIdx];
        quoteEl.innerText = `«${q.situation.substring(0, 100)}...»`;
      }
    }

    function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      const note = {
        id: Date.now(),
        slide: `Вопрос ${currentIdx + 1}`,
        time: `Ситуация ${currentIdx + 1}`,
        quote: document.getElementById('captureQuote').innerText,
        text: text,
        timestamp: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
      };

      reviewerNotes.push(note);
      localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(reviewerNotes));
      input.value = '';
      renderNotesList();
      updateNotesBadge();
    }

    function deleteNote(id) {
      reviewerNotes = reviewerNotes.filter(n => n.id !== id);
      localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(reviewerNotes));
      renderNotesList();
      updateNotesBadge();
    }

    function quickTag(tag) {
      const input = document.getElementById('noteInput');
      input.value = `[${tag}] ${input.value}`;
      input.focus();
    }

    function renderNotesList() {
      const list = document.getElementById('notesList');
      if (!list) return;
      if (reviewerNotes.length === 0) {
        list.innerHTML = '<div style="color:#64748b; font-size:13px; text-align:center; padding:20px 0;">Заметок пока нет. Нажмите Enter, чтобы добавить.</div>';
        return;
      }
      list.innerHTML = reviewerNotes.map(n => `
        <div class="note-item">
          <div class="note-item-header">
            <span>${n.slide} • ${n.time}</span>
            <span class="note-item-delete" onclick="deleteNote(${n.id})">✕ Удалить</span>
          </div>
          <div class="note-item-text">${n.text}</div>
        </div>
      `).join('');
    }

    function updateNotesBadge() {
      const badge = document.getElementById('notesBadge');
      if (badge) badge.innerText = reviewerNotes.length;
    }

    function copyNotesMarkdown() {
      if (reviewerNotes.length === 0) {
        alert('Нет заметок для копирования');
        return;
      }
      const md = reviewerNotes.map(n => `- **${n.slide} (${n.time})**: ${n.text}`).join('\n');
      navigator.clipboard.writeText(md).then(() => alert('Заметки скопированы в буфер!'));
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleReviewerDrawer();
      }
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      updateNotesBadge();
    });
  </script>

  <!-- Reviewer Slide-over Drawer -->
  <div class="reviewer-drawer" id="reviewerDrawer">
    <div class="drawer-header">
      <div class="drawer-title">
        <span>🚩</span> Панель рецензента (Замечания к квизу)
      </div>
      <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="toggleReviewerDrawer()">✕</button>
    </div>

    <div class="drawer-body">
      <div class="capture-box">
        <div class="capture-meta">
          <span id="captureSlide">ВОПРОС 1</span>
          <span id="captureTime">СИТУАЦИЯ 1</span>
        </div>
        <div class="capture-quote" id="captureQuote">
          Нажмите кнопку «M» или зафиксируйте замечание к текущему вопросу.
        </div>
        <input type="text" class="capture-input" id="noteInput" placeholder="Что исправить? (Нажмите Enter для сохранения)..." onkeydown="if(event.key === 'Enter') { event.preventDefault(); saveNote(); }">
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-primary" style="flex:1; justify-content:center; background:#0284c7; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:700; cursor:pointer;" onclick="saveNote()">+ Сохранить метку</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Формулировка')">Формулировка</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Озвучка')">Озвучка</button>
          <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:6px; cursor:pointer;" onclick="quickTag('Ответ')">Ответ</button>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size: 13px; font-weight: 700; color: #94a3b8;">Список правок:</span>
        <button class="btn" style="background:#1e293b; color:#fff; border:1px solid #334155; font-size: 11px; padding: 4px 8px; border-radius:6px; cursor:pointer;" onclick="copyNotesMarkdown()">📋 Скопировать для чата</button>
      </div>

      <div class="notes-list" id="notesList">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

</body>
</html>
