    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(11, 17, 32, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 1px solid #38bdf8;
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px;
      display: flex;
      flex-direction: column;
    }

    /* Progress & Stats Bar */
    .status-bar {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .progress-track {
      flex: 1;
      max-width: 380px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Quiz Card */
    .quiz-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      animation: fadeIn 0.3s ease;
    }

    .case-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .situation-box {
      background: rgba(30, 41, 59, 0.6);
      border-left: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 17px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .question-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.35;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .btn-audio-speak {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-audio-speak:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f8fafc;
      font-size: 17px;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(4px);
    }

    .option-letter {
      width: 34px;
      height: 34px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.18) !important;
      border-color: #22c55e !important;
      color: #4ade80 !important;
    }

    .option-btn.correct .option-letter {
      background: #22c55e;
      color: #fff;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.18) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
    }

    .option-btn.wrong .option-letter {
      background: #ef4444;
      color: #fff;
    }

    /* Hints & Explanation */
    .hint-box {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 16px 20px;
      color: #fde68a;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    .explain-box {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 16px;
      padding: 20px 24px;
      color: #dcfce7;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    .explain-title {
      font-size: 17px;
      font-weight: 800;
      color: #4ade80;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .explain-text {
      font-size: 16px;
      line-height: 1.6;
      color: #bbf7d0;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    /* Results Screen */
    .results-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 28px;
      padding: 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }

    .trophy-icon {
      font-size: 64px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .capture-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .capture-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .capture-quote {
      font-size: 13px;
      line-height: 1.4;
      color: #cbd5e1;
      font-style: italic;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid #38bdf8;
    }

    .capture-input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }

    .capture-input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .note-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
    }

    .note-item-delete {
      color: #ef4444;
      cursor: pointer;
    }

    .note-item-text {
      font-size: 13px;
      line-height: 1.4;
      color: #f8fafc;
    }
  
    @media (max-width: 640px) {
      header {
        padding: 10px 14px !important;
      }
      .header-title {
        font-size: 13px !important;
        max-width: 55vw !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      main {
        padding: 14px 12px 40px !important;
      }
      .status-bar {
        flex-direction: column !important;
        gap: 12px !important;
        align-items: stretch !important;
        padding: 12px 14px !important;
      }
      .progress-track {
        max-width: 100% !important;
        margin: 0 !important;
      }
      .quiz-card {
        padding: 20px 14px !important;
        border-radius: 18px !important;
        gap: 16px !important;
      }
      .situation-box {
        font-size: 15px !important;
        padding: 12px 14px !important;
      }
      .question-title {
        font-size: 16px !important;
        flex-direction: column !important;
        align-items: flex-start !important;
      }
      .option-btn {
        padding: 12px 14px !important;
        font-size: 13px !important;
      }
    }

  </style>

ент запустил самую дорогую и тяжелую рассуждающую модель, из-за чего исчерпал дневной лимит токенов уже на 15-й работе.", "question": "Какую модельную архитектуру методически грамотно выбрать для массовой потоковой обработки учебных текстов?", "options": [{"id": "A", "text": "Легковесные быстрые модели (Flash / Haiku / Mini): они в 10–20 раз быстрее и дешевле, превосходно справляются с классификацией, разметкой и вычиткой без переплаты за избыточный интеллект.", "correct": true}, {"id": "B", "text": "Исключительно локальную модель на 70 миллиардов параметров, требующую сервера с 4 видеокартами.", "correct": false}, {"id": "C", "text": "Только мультимодальную модель с обязательной генерацией иллюстрации к каждому эссе.", "correct": false}, {"id": "D", "text": "Модель, работающую в режиме шахматного анализатора ходов.", "correct": false}], "hints": ["Рутинная классификация и исправление опечаток не требуют многоступенчатого логического вывода.", "Семейства Flash/Haiku созданы специально для сверхвысокой скорости и обработки сотен типовых документов."], "explanation": "Для типовой потоковой рутины (сортировка, тегирование, вычитка) модели Flash/Haiku/Mini идеальны: они выдают ответ за доли секунды и экономят 90% бюджета квот преподавателя."}, {"id": 3, "badge": "Выбор моделей • Междисциплинарный синтез", "topic": "Флагманские модели Pro / Opus / Sonnet", "situation": "Преподаватель разрабатывает междисциплинарный спецкурс на стыке биотехнологий, патентного права и этики ИИ. Попытка сгенерировать структуру курса быстрой моделью привела к набору банальных лозунгов и поверхностному перечислению определений.", "question": "Почему для глубокого академического синтеза необходима флагманская модель (Pro / Opus / Sonnet)?", "options": [{"id": "A", "text": "Флагманы обладают глубоким концептуальным тезаурусом, удерживают сложные многоуровневые связи между разнородными отраслями знаний и создают целостную методологию.", "correct": true}, {"id": "B", "text": "Флагманские модели подключены к секретным закрытым базам данных РАН.", "correct": false}, {"id": "C", "text": "Только во флагманских моделях разрешено использовать русские термины длиннее 10 букв.", "correct": false}, {"id": "D", "text": "Они автоматически печатают готовые методички на институтском бланке.", "correct": false}], "hints": ["Междисциплинарный синтез требует сопоставления неочевидных понятий из далёких областей науки.", "Флагманские модели обучаются на огромных массивах научной литературы и обладают максимальной семантической ёмкостью."], "explanation": "Флагманские модели (Claude Sonnet/Opus, Gemini Pro, GPT-4o) обладают широким кругозором и тонким пониманием контекста, что критически важно при создании междисциплинарных программ и стандартов."}, {"id": 4, "badge": "Выбор моделей • Глубокие рассуждения", "topic": "Thinking / Reasoning модели", "situation": "Для студенческой олимпиады по теории алгоритмов требуется составить задачу с нетривиальной ловушкой в граничных условиях, пошаговым доказательством корректности и анализом асимптотической сложности O(N log N). Обычные чат-боты торопятся выдать ответ и допускают логическую ошибку на втором шаге.", "question": "Какой класс моделей обеспечит безупречную математическую строгость и самопроверку?", "options": [{"id": "A", "text": "Модели рассуждений (Reasoning / Thinking): они генерируют скрытую цепочку мыслей (Chain-of-Thought), перепроверяют гипотезы перед ответом и находят собственные ошибки.", "correct": true}, {"id": "B", "text": "Генераторы изображений, так как они мыслят визуальными образами графов.", "correct": false}, {"id": "C", "text": "Базовые автодополнители поисковой строки браузера.", "correct": false}, {"id": "D", "text": "Голосовые ассистенты для воспроизведения прогноза погоды.", "correct": false}], "hints": ["Обратите внимание на модели с пометкой «Thinking» (o1, o3, Gemini 2.0 Flash Thinking, DeepSeek-R1).", "Скрытый черновик рассуждений позволяет модели смоделировать процесс решения как живому учёному."], "explanation": "Reasoning-модели тратят вычислительное время на генерацию внутреннего скрытого черновика рассуждений (thinking tokens), отсекая тупиковые ветви и перепроверяя граничные условия до выдачи финального ответа."}, {"id": 5, "badge": "Интерфейс • Системный профиль", "topic": "Пользовательские инструкции (Custom Instructions)", "situation": "Преподаватель устал в каждом новом диалоге повторять: «Я доцент кафедры электротехники, пиши строго по ГОСТ 7.32, не используй водянистых приветствий, оформляй формулы в LaTeX».", "question": "Какая функция интерфейса навсегда закрепляет эти базовые методические требования для всех будущих бесед?", "options": [{"id": "A", "text": "Системные инструкции профиля (Custom Instructions / System Prompt): они невидимо подмешиваются ко всем новым диалогам, задавая постоянную академическую роль и правила оформления.", "correct": true}, {"id": "B", "text": "Постоянная отправка электронных писем в службу технической поддержки нейросети.", "correct": false}, {"id": "C", "text": "Сохранение текстового файла на рабочем столе компьютера без открытия чата.", "correct": false}, {"id": "D", "text": "Установка специального шрифта в операционной системе Windows.", "correct": false}], "hints": ["Эта настройка находится в профиле пользователя и действует сквозным образом на все чаты.", "System Prompt избавляет от необходимости тратить время на копирование одного и того же контекста."], "explanation": "Custom Instructions действуют как невидимый фундамент каждого диалога: модель сразу знает вашу кафедру, академические стандарты, предпочитаемый тон и запреты на вводные слова."}, {"id": 6, "badge": "Работа с данными • Скрепка и вложения", "topic": "Загрузка документов (DOCX, PDF, XLSX)", "situation": "Преподавателю нужно адаптировать утверждённую рабочую программу дисциплины (РПД на 45 страниц) под обновленный профессиональный стандарт. Он планирует вручную копировать текст кусками по 2 страницы в поле ввода чата.", "question": "В чём заключается грубая неэффективность такого подхода и как интерфейс решает эту задачу?", "options": [{"id": "A", "text": "Ручная вставка разрушает контекстную целостность; современный интерфейс позволяет прикрепить целый файл (DOCX/PDF) через «скрепку», парсит документ целиком и сохраняет структуру разделов.", "correct": true}, {"id": "B", "text": "Через скрепку можно загружать только фотографии преподавателя для подтверждения диплома.", "correct": false}, {"id": "C", "text": "Нейросети принципиально не способны открывать файлы с расширением .docx.", "correct": false}, {"id": "D", "text": "Копирование через буфер обмена автоматически удаляет согласные буквы из текста.", "correct": false}], "hints": ["Интерфейсная «скрепка» передаёт файл во внутренний парсер документов.", "Парсер преобразует таблицы, заголовки и списки в единое контекстное представление."], "explanation": "Загрузка файла целиком через скрепку задействует встроенный экстрактор данных: модель видит сквозную нумерацию, взаимосвязь модулей и компетенций, исключая человеческие ошибки при ручной нарезке."}, {"id": 7, "badge": "Работа с данными • Контекстное окно", "topic": "Индикатор контекста и эффект Lost in the Middle", "situation": "При анализе сборника методических статей объёмом 300 страниц преподаватель поместил самое важное требование к реферату ровно в середину гигантского документа. Модель ответила подробно по началу и концу файла, но полностью проигнорировала ключевое центральное указание.", "question": "Какая особенность внимания больших языковых моделей (LLM) проявилась в этом сценарии?", "options": [{"id": "A", "text": "Эффект «Потери в середине» (Lost in the Middle): при предельной загрузке контекста трансформер уделяет максимальное внимание началу и концу окна, снижая фокус на середине.", "correct": true}, {"id": "B", "text": "Центральные страницы документа были зашифрованы антивирусом браузера.", "correct": false}, {"id": "C", "text": "Нейросеть экономит электроэнергию, пропуская четные страницы любого документа.", "correct": false}, {"id": "D", "text": "В середине любого PDF-файла плотность пикселей падает до критического минимума.", "correct": false}], "hints": ["Внимание трансформера распределяется неравномерно по всей длине контекстного окна.", "Ключевые инструкции и ограничения методически грамотно дублировать в самом конце промпта."], "explanation": "Исследования архитектуры трансформеров доказали эффект «Lost in the Middle»: информация в середине длинного контекста извлекается с меньшей вероятностью. Критические инструкции всегда размещайте в финальной части запроса."}, {"id": 8, "badge": "Инструменты • Граница текста", "topic": "Почему чистая LLM — не калькулятор", "situation": "Преподаватель физики попросил модель в чистом чате перемножить два 8-значных числа и рассчитать корень из 17-значного дискриминанта. Модель уверенно и мгновенно выдала красивое число, которое при перепроверке на калькуляторе оказалось ошибочным в трёх последних знаках.", "question": "В чём фундаментальная причина ошибки модели при выполнении строгих численных расчетов?", "options": [{"id": "A", "text": "Чистая LLM — вероятностный предсказатель следующих токенов, а не процессор: она угадывает правдоподобный вид ответа, а не выполняет алгоритмические вычисления.", "correct": true}, {"id": "B", "text": "Нейросети обучены только на гуманитарной литературе и не знают таблицы умножения.", "correct": false}, {"id": "C", "text": "Внутренний таймер модели сработал быстрее, чем успел запуститься математический сопроцессор.", "correct": false}, {"id": "D", "text": "Преподаватель забыл указать единицы измерения в системе СИ.", "correct": false}], "hints": ["Языковая модель генерирует символы по распределению вероятностей.", "Для точных расчетов модели требуется внешний исполняемый инструмент — калькулятор или среда кода."], "explanation": "Языковая модель генерирует текст статистически: она «помнит», как выглядит числовой ответ, но физически не имеет математического сопроцессора. Для точных цифр ей необходим вызов инструментов (Tool Calling)."}, {"id": 9, "badge": "Инструменты • Архитектура Tool Calling", "topic": "Трехфазный цикл вызова функций", "situation": "При решении инженерной задачи в современном ИИ-интерфейсе пользователь видит плашку «Выполняется код Python...», после чего на экране появляется точный числовой ответ и график переходного процесса.", "question": "Как устроен трехфазный цикл взаимодействия модели и внешнего инструмента (Tool Calling)?", "options": [{"id": "A", "text": "1. Модель формулирует вызов `call_tool(args)`; 2. Внешняя изолированная среда исполняет команду; 3. Результат возвращается модели, и она формулирует педагогический вывод.", "correct": true}, {"id": "B", "text": "Модель мысленно представляет график и телепатически передаёт его на монитор преподавателя.", "correct": false}, {"id": "C", "text": "Сотрудник службы поддержки вручную запускает Excel и вставляет скриншот в чат.", "correct": false}, {"id": "D", "text": "Браузер отправляет запрос на сайт Википедии и вырезает оттуда готовый рисунок.", "correct": false}], "hints": ["Модель сама по себе не выполняет код — она формирует инструкцию для внешней песочницы.", "Песочница возвращает текстовый вывод (stdout) или изображение обратно в контекст модели."], "explanation": "Трехфазный цикл Tool Calling: 1) Модель понимает нехватку численной точности и генерирует код вызова инструмента; 2) Среда выполнения (Sandbox) исполняет код; 3) Модель интерпретирует ответ для пользователя."}, {"id": 10, "badge": "Арсенал инструментов • Web Search", "topic": "Поиск в сети и актуализация первоисточников", "situation": "Преподавателю кафедры необходимо проверить, действуют ли ссылки на нормативные акты Минобрнауки в программе практики за 2026 год. Базовая база знаний модели была зафиксирована в начале прошлого года.", "question": "Какой инструмент интерфейса гарантирует абсолютную юридическую актуальность ответа?", "options": [{"id": "A", "text": "Инструмент живого веб-поиска (Web Search / Grounding): модель выполняет поисковые запросы, сканирует свежие официальные порталы и подкрепляет тезисы кликабельными ссылками.", "correct": true}, {"id": "B", "text": "Повторная отправка того же промпта с добавлением слова «СРОЧНО».", "correct": false}, {"id": "C", "text": "Использование генератора картинок для воссоздания печати министерства.", "correct": false}, {"id": "D", "text": "Перезагрузка операционной системы с очисткой кэша DNS.", "correct": false}], "hints": ["Инструмент поиска преодолевает ограничение даты среза обучающих данных (Knowledge Cutoff).", "Модель цитирует реальные URL-адреса найденных государственных реестров."], "explanation": "Web Search (Grounding) соединяет модель с актуальным интернетом в реальном времени: модель находит действующие приказы и регламенты, подтверждая каждый вывод ссылкой на первоисточник."}, {"id": 11, "badge": "Арсенал инструментов • Python Sandbox", "topic": "Точные расчеты и генерация графики (Matplotlib)", "situation": "Для лабораторной работы по электротехнике требуется построить семейство векторных диаграмм токов и напряжений трехфазной цепи при несимметричной нагрузке с абсолютной геометрической точностью фазовых углов.", "question": "Какой встроенный инструмент интерфейса создаст математически безупречную иллюстрацию?", "options": [{"id": "A", "text": "Встроенная песочница Python (Code Execution / Advanced Data Analysis): модель пишет скрипт на базе библиотек NumPy и Matplotlib, вычисляет векторы и рендерит точный векторный график.", "correct": true}, {"id": "B", "text": "Диффузионная нейросеть для генерации художественных фэнтези-артов.", "correct": false}, {"id": "C", "text": "Текстовое описание векторов словами с помощью смайликов-стрелочек.", "correct": false}, {"id": "D", "text": "Голосовой диктофон операционной системы.", "correct": false}], "hints": ["Инженерные чертежи и диаграммы требуют точных формул синусов и косинусов.", "Python Sandbox компилирует код и возвращает график в формате высокого разрешения (PNG/SVG)."], "explanation": "Python Sandbox в интерфейсе позволяет модели писать и запускать код: библиотека Matplotlib строит векторы по законам тригонометрии, гарантируя 100% инженерную достоверность без галлюцинаций."}, {"id": 12, "badge": "Арсенал инструментов • Vision & OCR", "topic": "Оцифровка сканов, схем и рукописей", "situation": "В архиве кафедры сохранилась уникальная методичка 1984 года с пожелтевшими принципиальными электрическими схемами и рукописными пометками заслуженного профессора на полях. Набирать текст и перерисовывать схемы вручную займет две недели.", "question": "Как инструмент компьютерного зрения (Vision / Multimodal Parser) автоматизирует эту работу?", "options": [{"id": "A", "text": "Принимает фото страницы, распознаёт полустёртый рукописный текст, расшифровывает условные графические обозначения элементов схемы и генерирует их современный цифровой эквивалент.", "correct": true}, {"id": "B", "text": "Удаляет старый файл с жесткого диска как морально устаревший.", "correct": false}, {"id": "C", "text": "Преобразует цвет бумаги из желтого в белый без чтения текста.", "correct": false}, {"id": "D", "text": "Генерирует фантастический рассказ о жизни лаборатории в 1984 году.", "correct": false}], "hints": ["Мультимодальные модели считывают пиксели напрямую через визуальный энкодер.", "Они способны распознавать ГОСТовские схемные обозначения (резисторы, конденсаторы, транзисторы)."], "explanation": "Мультимодальный инструмент Vision анализирует изображение комплексно: оцифровывает рукописные комментарии, восстанавливает номиналы радиодеталей и переводит архивную схему в структурированный цифровой вид."}, {"id": 13, "badge": "Аудит инструментов • Контроль песочницы", "topic": "Проверка кода и блока Output", "situation": "Модель рассчитала тепловой баланс котельной установки и вывела итоговое значение КПД: 94.2%. Преподаватель открыл спойлер «Показать код» (Show work) и увидел, что в строке формулы модель забыла учесть потери тепла с уход 0 лет.", "correct": false}, {"id": "C", "text": "Репозиторий автоматически повышает заработную плату всех сотрудников института в 10 раз.", "correct": false}, {"id": "D", "text": "Такая структура нужна только для отчёта перед международными рейтинговыми агентствами.", "correct": false}], "hints": ["Принцип Single Source of Truth гарантирует, что учебный контент не потеряется при смене кадров.", "Чёткий цифровой пайплайн превращает индивидуальное ремесло в надёжное инженерное производство."], "explanation": "Культура цифрового производства (репозиторий, единый манифест, сценарии в Markdown) превращает учебно-методический комплекс кафедры в неуязвимый долговечный актив, гарантируя лёгкую модернизацию и преемственность поколений."}];
    const SESSION_COUNT = 7;

    // Session State
    let sessionQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let currentAttempts = 0;
    let userHistory = [];
    let isSpeaking = false;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({
        ...q,
        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

    function renderQuestion() {
      stopSpeech();
      currentAttempts = 0;
      const q = sessionQuestions[currentIdx];
      
      // Update progress
      document.getElementById('stepCounter').innerText = `Вопрос ${currentIdx + 1} из ${SESSION_COUNT}`;
      const pct = Math.round((currentIdx / SESSION_COUNT) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('currentScore').innerText = score;

      const root = document.getElementById('cardRoot');
      root.innerHTML = `
        <div class="quiz-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="case-badge">${q.badge}</div>
            <div style="font-size: 14px; color: #94a3b8;">Попытка: <span id="attemptDisplay" style="color: #fff; font-weight: 800;">1</span> из 3</div>
          </div>

          <div class="situation-box">
            💡 <strong>Ситуация:</strong> ${q.situation}
          </div>

          <div class="question-title">
            <span>${q.question}</span>
            <button class="btn-audio-speak" id="speakQBtn" onclick="toggleSpeakQuestion()" title="Озвучить вопрос вслух для удобства">
              🔊 Озвучить
            </button>
          </div>

          <div class="options-grid" id="optionsGrid">
            ${q.options.map((opt, i) => `
              <button class="option-btn" id="opt_${opt.id}" onclick="handleSelect('${opt.id}')">
                <span class="option-letter">${opt.id}</span>
                <span>${opt.text}</span>
              </button>
            `).join('')}
          </div>

          <div id="hintContainer" style="display: none;"></div>
          <div id="explainContainer" style="display: none;"></div>

          <div class="quiz-footer" id="footerActions" style="display: none;">
            <div id="roundResultText" style="font-size: 15px;"></div>
            <button class="btn btn-primary" onclick="handleNextQuestion()" style="padding: 12px 24px;">
              <span>${currentIdx === SESSION_COUNT - 1 ? 'Завершить практикум ★' : 'Следующий кейс →'}</span>
            </button>
          </div>
        </div>
      `;

      // // markCurrentContext();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        let earned = 3; if (currentAttempts === 2) earned = 2; if (currentAttempts >= 3) earned = 1;
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

    function showHint(text, hintNum) {
      const box = document.getElementById('hintContainer');
      box.style.display = 'flex';
      box.className = 'hint-box';
      box.innerHTML = `
        <span style="font-size: 24px;">💡</span>
        <div>
          <strong>Подсказка ${hintNum}:</strong> ${text}
        </div>
      `;
    }

    function showExplanation(q, isPassed, earned) {
      const explainBox = document.getElementById('explainContainer');
      explainBox.style.display = 'flex';
      explainBox.className = 'explain-box';
      explainBox.innerHTML = `
        <div class="explain-title">
          <span>${isPassed ? '✓ Верно! Методический разбор:' : '❌ Разбор ситуации:'}</span>
          <button class="btn-audio-speak" id="speakExpBtn" onclick="toggleSpeakExplanation()" title="Озвучить методический разбор">
            🔊 Озвучить разбор
          </button>
        </div>
        <div class="explain-text" id="explainTextContent">
          ${q.explanation}
        </div>
      `;

      // Footer
      const footer = document.getElementById('footerActions');
      footer.style.display = 'flex';
      const roundText = document.getElementById('roundResultText');
      if (isPassed) {
        const suffix = earned === 1 ? '\u0431\u0430\u043B\u043B' : '\u0431\u0430\u043B\u043B\u0430'; roundText.innerHTML = `<span style="color: #22c55e; font-weight: 700;">+${earned} ${suffix}</span> (\u043F\u043E\u043F\u044B\u0442\u043A\u0430: ${currentAttempts})`;
      } else {
        roundText.innerHTML = `<span style="color: #f87171; font-weight: 700;">0 баллов</span> (использованы все 3 попытки)`;
      }

      userHistory.push({
        badge: q.badge,
        question: q.question,
        earned: earned,
        attempts: currentAttempts,
        passed: isPassed
      });
    }

    function handleNextQuestion() {
      if (currentIdx < SESSION_COUNT - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      stopSpeech();
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('stepCounter').innerText = 'Практикум завершён!';

      const maxScore = SESSION_COUNT * 3;
      const pct = Math.round((score / maxScore) * 100);

      let trophy = '🎓';
      let title = 'Базовый уровень освоения';
      if (pct >= 85) {
        trophy = '🏆';
        title = 'Эксперт инструментов и методов ИИ';
      } else if (pct >= 65) {
        trophy = '⭐';
        title = 'Уверенный преподаватель-практик';
      }

      // Save completion status
      try {
        localStorage.setItem('ai_course_l5_p4_completed', 'true');
      } catch(e) {}

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="results-card">
          <div class="trophy-icon">${trophy}</div>
          <h1 style="font-size: 34px; font-weight: 900; color: #fff;">${title}</h1>
          <p style="font-size: 19px; color: #94a3b8; max-width: 650px; line-height: 1.5;">
            Вы завершили интерактивный практикум Урока 5. Знания цифрового рабочего места, выбора моделей, вызова инструментов (Tool Calling), аудита песочницы и агентного контроля версий успешно закреплены.
          </p>

          <div style="background: rgba(56, 189, 248, 0.12); border: 2px solid #38bdf8; border-radius: 20px; padding: 20px 40px; margin: 8px 0;">
            <div style="font-size: 48px; font-weight: 900; color: #38bdf8; font-family: 'JetBrains Mono', monospace;">
              ${score} / ${maxScore}
            </div>
            <div style="font-size: 16px; color: #cbd5e1; font-weight: 700;">${pct}% успешных ответов</div>
          </div>

          <div style="width: 100%; max-width: 700px; text-align: left; background: rgba(3, 7, 18, 0.5); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.08);">
            <div style="font-size: 16px; font-weight: 800; color: #38bdf8; margin-bottom: 12px;">📊 Детализация по темам сессии:</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${userHistory.map((h, i) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; font-size: 15px;">
                  <span>${i+1}. <strong>${h.badge}</strong></span>
                  <span style="font-weight: 700; color: ${h.passed ? '#4ade80' : '#f87171'};">
                    ${h.earned} б. (${h.attempts} ${h.attempts===1?'попытка':'попытки'})
                  </span>
                </div>
              `).join('')}
            </div>
          </div>

          <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 12px;">
                        <a href="lesson_6_1.html" class="btn btn-primary" style="padding: 14px 26px; font-size: 16px; background: linear-gradient(135deg, #0284c7, #38bdf8); text-decoration: none;">
              Следующая лекция: 6.1 — Трансформация методички в сценарий лекции →
            </a>
<button class="btn btn-primary" onclick="startNewSession()" style="padding: 14px 26px; font-size: 16px;">
              🔄 Пройти другой вариант (7 новых вопросов из банка 18)
            </button>
            <button class="btn" onclick="copyProtocol()" style="padding: 14px 20px;">
              📋 Скопировать протокол
            </button>
            <a href="index.html" class="btn" style="padding: 14px 20px;">
              К программе курса
            </a>
          </div>
        </div>
      `;
    }

    function copyProtocol() {
      let text = '=== ПРОТОКОЛ ТЕСТИРОВАНИЯ: КУРС ПО ИИ (УРОК 5: ИНТЕРФЕЙС, ИНСТРУМЕНТЫ И ВЕРСИОННОСТЬ) ===\n';
      text += `Итоговый результат: ${score} из ${SESSION_COUNT * 3} баллов\n`;
      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

    // Speech Synthesis
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const qBtn = document.getElementById('speakQBtn');
      if (qBtn) qBtn.innerText = '🔊 Озвучить';
      const expBtn = document.getElementById('speakExpBtn');
      if (expBtn) expBtn.innerText = '🔊 Озвучить разбор';
    }

    function toggleSpeakQuestion() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      const textToSpeak = `${q.situation}. Вопрос: ${q.question}`;
      speakText(textToSpeak, 'speakQBtn');
    }

    function toggleSpeakExplanation() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      speakText(q.explanation, 'speakExpBtn');
    }

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleReviewerDrawer() {}
    function markCurrentContext() {}
    window.addEventListener('keydown', (e) => {
      
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      // // updateNotesBadge();
    });
  </script>
</body>
</html>
