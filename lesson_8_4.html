<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практикум 8.4: Итоговая самопроверка</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(11, 17, 32, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 1px solid #38bdf8;
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px;
      display: flex;
      flex-direction: column;
    }

    /* Progress & Stats Bar */
    .status-bar {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .progress-track {
      flex: 1;
      max-width: 380px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Quiz Card */
    .quiz-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      animation: fadeIn 0.3s ease;
    }

    .case-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .situation-box {
      background: rgba(30, 41, 59, 0.6);
      border-left: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 17px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .question-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.35;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .btn-audio-speak {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-audio-speak:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f8fafc;
      font-size: 17px;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(4px);
    }

    .option-letter {
      width: 34px;
      height: 34px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.18) !important;
      border-color: #22c55e !important;
      color: #4ade80 !important;
    }

    .option-btn.correct .option-letter {
      background: #22c55e;
      color: #fff;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.18) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
    }

    .option-btn.wrong .option-letter {
      background: #ef4444;
      color: #fff;
    }

    /* Hints & Explanation */
    .hint-box {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 16px 20px;
      color: #fde68a;
      font-size: 15px;
      line-height: 1.5;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    .explain-box {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 16px;
      padding: 20px 24px;
      color: #dcfce7;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    .explain-title {
      font-size: 17px;
      font-weight: 800;
      color: #4ade80;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .explain-text {
      font-size: 16px;
      line-height: 1.6;
      color: #bbf7d0;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    /* Results Screen */
    .results-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 28px;
      padding: 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }

    .trophy-icon {
      font-size: 64px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .capture-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .capture-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .capture-quote {
      font-size: 13px;
      line-height: 1.4;
      color: #cbd5e1;
      font-style: italic;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid #38bdf8;
    }

    .capture-input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
    }

    .capture-input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .note-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
    }

    .note-item-delete {
      color: #ef4444;
      cursor: pointer;
    }

    .note-item-text {
      font-size: 13px;
      line-height: 1.4;
      color: #f8fafc;
    }
  
    @media (max-width: 640px) {
      header {
        padding: 10px 14px !important;
      }
      .header-title {
        font-size: 13px !important;
        max-width: 55vw !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      main {
        padding: 14px 12px 40px !important;
      }
      .status-bar {
        flex-direction: column !important;
        gap: 12px !important;
        align-items: stretch !important;
        padding: 12px 14px !important;
      }
      .progress-track {
        max-width: 100% !important;
        margin: 0 !important;
      }
      .quiz-card {
        padding: 20px 14px !important;
        border-radius: 18px !important;
        gap: 16px !important;
      }
      .situation-box {
        font-size: 15px !important;
        padding: 12px 14px !important;
      }
      .question-title {
        font-size: 16px !important;
        flex-direction: column !important;
        align-items: flex-start !important;
      }
      .option-btn {
        padding: 12px 14px !important;
        font-size: 13px !important;
      }
    }

  </style>

    <!-- Active Question Container -->
    <div id="cardRoot"></div>
  </main>

  <script>
    const FULL_QUESTION_BANK = [{"id": 1, "badge": "Занятие 1 • Понятийный аппарат", "topic": "Иерархия понятий: ИИ, машинное обучение и глубокие нейросети", "situation": "При подготовке лекционного модуля преподавателю необходимо дать студентам строгое определение взаимосвязи между искусственным интеллектом, методами машинного обучения и глубокими нейросетями.", "question": "Какая формулировка строго соответствует принятой в академической среде иерархии понятий?", "options": [{"id": "A", "text": "Машинное обучение является подразделом ИИ, а глубокое обучение (нейросети с множеством слоёв) — специализированной частью машинного обучения.", "correct": true}, {"id": "B", "text": "Глубокое обучение является надмножеством, включающим в себя классический ИИ и экспертные системы.", "correct": false}, {"id": "C", "text": "Все три термина являются синонимами и обозначают статистическую регрессию больших данных.", "correct": false}, {"id": "D", "text": "ИИ относится исключительно к робототехнике, а машинное обучение — к работе с таблицами в базах данных.", "correct": false}], "hints": ["Вспомните диаграмму вложенности из Урока 1.1: более общее понятие охватывает более узкие методы.", "Глубокие нейронные сети появились как развитие методов классического обучения на данных."], "explanation": "Искусственный интеллект — широкая научная область. Машинное обучение — его статистический подраздел. Глубокое обучение — подраздел машинного обучения, основанный на многослойных искусственных нейронных сетях."}, {"id": 2, "badge": "Занятие 1 • Природа моделей", "topic": "Причина галлюцинаций в генеративных языковых моделях", "situation": "В ответе нейросети на запрос о методике расчёта цепи приведена правдоподобно звучащая ссылка на несуществующую статью профессора кафедры.", "question": "Какова фундаментальная причина этого явления («галлюцинации»)?", "options": [{"id": "A", "text": "Языковая модель предсказывает наиболее статистически вероятные токены (слова), не обладая встроенной базой проверенных фактов реального мира.", "correct": true}, {"id": "B", "text": "В сервере нейросети произошёл аппаратный сбой оперативной памяти при вычислении матричных произведений.", "correct": false}, {"id": "C", "text": "Нейросеть намеренно защищает авторские права и поэтому заменяет реальные библиографические ссылки фиктивными.", "correct": false}, {"id": "D", "text": "Модель перегружена запросами других пользователей и временно перешла в режим случайной генерации.", "correct": false}], "hints": ["Вспомните, как обучаются трансформеры: они максимизируют вероятность следующего слова в тексте.", "Модель не «знает» истину, она воспроизводит правдоподобные текстовые паттерны."], "explanation": "Генеративные языковые модели работают на базе вероятностного распределения токенов. Если в обучающей выборке часто встречались научные ссылки, модель синтезирует похожую по структуре, но вымышленную библиографию."}, {"id": 3, "badge": "Занятие 2 • Промпт-инжиниринг", "topic": "Ролевой контекст и академический стиль запроса", "situation": "Преподаватель формулирует промпт для составления раздела методических указаний по законам Кирхгофа для студентов 2 курса инженерного факультета.", "question": "Какая из приведённых формулировок запроса обеспечит наивысшее дидактическое качество и академическую точность?", "options": [{"id": "A", "text": "«Выступите в роли доцента инженерной кафедры. Напишите раздел методических указаний по законам Кирхгофа для студентов 2 курса. Требования: строгие формулировки, формулы в LaTeX, без речевых клише».", "correct": true}, {"id": "B", "text": "«Напиши как-нибудь понятно про законы Кирхгофа, чтобы студенты поняли, простыми словами без заумных формул».", "correct": false}, {"id": "C", "text": "«Сделай мне методичку по электротехнике очень быстро и качественно, используй самые передовые методы».", "correct": false}, {"id": "D", "text": "«Расскажи всё, что ты знаешь про электрические цепи, от школьной физики до квантовой механики».", "correct": false}], "hints": ["Эффективный промпт задаёт роль эксперта, целевую аудиторию, тему и чёткие технические ограничения.", "Избегайте размытых фраз вроде «как-нибудь понятно»."], "explanation": "Чёткое задание роли («доцент кафедры»), целевой аудитории («студенты 2 курса») и формата («LaTeX, без клише») задаёт строгие контекстные рамки для языковой модели."}, {"id": 4, "badge": "Занятие 2 • Few-Shot обучение", "topic": "Техника передачи эталонных образцов в промпте", "situation": "Преподавателю необходимо, чтобы нейросеть оформила 20 тестовых вопросов в нестандартном внутреннем формате кафедры.", "question": "Какой метод взаимодействия с моделью даст самый надёжный результат с первой попытки?", "options": [{"id": "A", "text": "Few-Shot промптинг: передать модели 2–3 готовых эталонных примера вопросов с ожидаемой разметкой перед формулировкой основного задания.", "correct": true}, {"id": "B", "text": "Zero-Shot промптинг: просто написать «оформи в формате нашей кафедры» без приведения примеров.", "correct": false}, {"id": "C", "text": "Повторить один и тот же абстрактный запрос пять раз подряд, выбирая лучший случайный результат.", "correct": false}, {"id": "D", "text": "Написать промпт заглавными буквами с восклицательными знаками для придания важности.", "correct": false}], "hints": ["Метод Few-Shot («с несколькими примерами») обучает модель нужному шаблону прямо в контекстном окне.", "Показ образца «входные данные → эталонный выход» устраняет двусмысленность."], "explanation": "Передача 2–3 эталонных образцов в промпте (Few-Shot) позволяет нейросети зафиксировать синтаксис и структуру вывода с максимальной точностью."}, {"id": 5, "badge": "Занятие 3 • Дизайн слайдов", "topic": "Принцип когнитивной чистоты учебных презентаций", "situation": "При подготовке слайда лекции ИИ предложил разместить на одном экране три абзаца сплошного текста мелким шрифтом, четыре разноцветных стрелки и пять разных гарнитур шрифта.", "question": "Какое правило современного академического дизайна нарушено?", "options": [{"id": "A", "text": "Принцип когнитивной чистоты: один экран — один ключевой тезис, иерархия шрифтов (не более двух гарнитур) и структурирование информации по колонкам/шагам.", "correct": true}, {"id": "B", "text": "Нарушено требование использовать исключительно ярко-красный фон для привлечения внимания студентов.", "correct": false}, {"id": "C", "text": "На слайде обязательно должно быть не менее 500 слов, чтобы студент успевал переписать текст в тетрадь.", "correct": false}, {"id": "D", "text": "Все слайды в университете обязаны оформляться только в чёрно-белой гамме без использования векторной графики.", "correct": false}], "hints": ["Вспомните стандарт кинематографического режима и три ступени визуализации из Урока 3.", "Перегрузка экрана текстовой массой вызывает когнитивное торможение аудитории."], "explanation": "Академический стандарт визуализации требует строгой иерархии: не более 1–2 гарнитур, один фокус внимания на слайд и разделение сложной информации на пошаговые смысловые блоки."}, {"id": 6, "badge": "Занятие 3 • Векторная графика", "topic": "Преимущества SVG перед растровыми изображениями (PNG/JPEG)", "situation": "Кафедра выбирает графический формат для отображения электрических схем и векторных диаграмм в интерактивных учебных материалах.", "question": "Почему рекомендуется использовать чистый векторный код SVG, а не растровые изображения формата PNG или JPEG?", "options": [{"id": "A", "text": "SVG масштабируется без потери резкости на любых разрешениях, имеет малый вес и позволяет динамически управлять элементами (стрелками, цветами, маркерами тока) через JavaScript.", "correct": true}, {"id": "B", "text": "Растровые форматы PNG запрещены государственным стандартом высшего образования.", "correct": false}, {"id": "C", "text": "SVG является звуковым форматом и позволяет одновременно проигрывать голос лектора.", "correct": false}, {"id": "D", "text": "Векторная графика автоматически переводит текст лекции на все европейские ному объекту изучения.", "Лицо человека — сильнейший зрительный раздражитель, отвлекающий от мелких деталей чертежа."], "explanation": "Во время анализа схем и вычислений лицо лектора отвлекает взгляд студента от математических и физических связей. Аватар уместен на этапах мотивации и резюме."}, {"id": 10, "badge": "Занятие 7 • Веб-лаборатории", "topic": "Деятельностное обучение в интерактивных симуляторах", "situation": "Кафедра сравнивает эффективность видеозаписи лабораторного опыта и интерактивного веб-симулятора цепи на HTML5/JS.", "question": "Что является главным дидактическим преимуществом интерактивной веб-лаборатории перед видеозаписью опыта на физическом стенде?", "options": [{"id": "A", "text": "Деятельностное обучение: студент сам меняет параметры цепи, исследует нестандартные и аварийные режимы (КЗ, ХХ) и проверяет законы физики на собственном опыте.", "correct": true}, {"id": "B", "text": "Видеозапись всегда занимает больше места на сервере университета, чем веб-страница.", "correct": false}, {"id": "C", "text": "В веб-лаборатории невозможно допустить ошибку при вычислениях.", "correct": false}, {"id": "D", "text": "Интерактивные симуляторы полностью исключают необходимость изучения теоретического учебника.", "correct": false}], "hints": ["Пассивный зритель воспринимает информацию хуже, чем исследователь, проводящий опыт своими руками.", "Возможность безопасно смоделировать предельный режим формирует инженерную интуицию."], "explanation": "Интерактивный симулятор переводит студента из пассивного созерцателя в активного исследователя, позволяя проверить законы физики в динамике."}, {"id": 11, "badge": "Занятие 7 • Стрелочные приборы", "topic": "Самостоятельное определение цены деления по ГОСТ", "situation": "На виртуальном стенде установлен аналоговый прибор со шкалой на 30 делений и пределом измерения 300 мА.", "question": "Почему в интерфейсе не следует сразу выводить готовую подсказку «Цена одного деления = 10 мА»?", "options": [{"id": "A", "text":     const SESSION_COUNT = 7;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({

        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        let earned = 3; if (currentAttempts === 2) earned = 2; if (currentAttempts >= 3) earned = 1;
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

      } else {

        question: q.question,
        earned: earned,

      });
    }

    function copyProtocol() {
      let text = '=== ИТОГ САМОПРОВЕРКИ: ОБЗОР ИИ ДЛЯ ПОДГОТОВКИ УЧЕБНЫХ МАТЕРИАЛОВ ===\n';
      text += `Результат: ${score} из ${SESSION_COUNT * 3} баллов\n`;
      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

    // Speech Synthesis
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const qBtn = document.getElementById('speakQBtn');
      if (qBtn) qBtn.innerText = '🔊 Озвучить';
      const expBtn = document.getElementById('speakExpBtn');
      if (expBtn) expBtn.innerText = '🔊 Озвучить разбор';
    }

    function toggleSpeakQuestion() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      const textToSpeak = `${q.situation}. Вопрос: ${q.question}`;
      speakText(textToSpeak, 'speakQBtn');
    }

    function toggleSpeakExplanation() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      speakText(q.explanation, 'speakExpBtn');
    }

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleReviewerDrawer() {}
    function markCurrentContext() {}
    window.addEventListener('keydown', (e) => {
      
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      // // updateNotesBadge();
    });
  </script>
  <script src="assets/glossary_tooltips.js" defer></script>
</body>
</html>
