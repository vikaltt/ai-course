ния Бернулли для слайда». ИИ оставил только итоговую формулу, полностью вырезав упоминания о несжимаемости жидкости, установившемся движении и отсутствии вязкого трения. На семинаре студенты начали применять формулу к сверхзвуковым газовым потокам с грубыми ошибками.", "question": "В чём состоит критическая опасность неконтролируемой суммаризации математического и инженерного текста нейросетью?", "options": [{"id": "A", "text": "ИИ склонен в погоне за краткостью удалять граничные условия, ограничения применимости и физические допущения, превращая научный закон в ложное универсальное утверждение.", "correct": true}, {"id": "B", "text": "Нейросеть автоматически заменяет все греческие символы латинскими буквами из-за ограничений кодировки.", "correct": false}, {"id": "C", "text": "ИИ не умеет отображать знаки интегралов и сумм в коротких текстах.", "correct": false}, {"id": "D", "text": "Сокращённые формулы требуют обязательного утверждения в Министерстве науки и высшего образования.", "correct": false}], "hints": ["Инженерная строгость закона заключается не только в знаке равенства, но и в области его физической справедливости.", "В промпте для суммаризации необходимо прямо предписывать сохранение физических рамок и допущений."], "explanation": "Уравнения в инженерных дисциплинах справедливы лишь при строгом соблюдении допущений модели. При компрессии учебного материала через ИИ преподаватель обязан контролировать сохранение всех граничных условий и диапазона применимости."}, {"id": 3, "badge": "Дидактическое ядро • Драматургия лекции", "topic": "Проблемно-ориентированное введение (Парадокс)", "situation": "Лекция по сопромату начинается традиционно: лектор монотонно зачитывает со слайда 1 формулировку третьей гипотезы прочности и геометрические характеристики сечений. В поточной аудитории на 150 студентов быстро нарастает фоновый гул и безразличие.", "question": "Как перестроить драматургию начала лекции с помощью ИИ согласно принципу инженерного парадокса?", "options": [{"id": "A", "text": "Сформулировать с помощью ИИ реальный аварийный кейс или контринтуитивный инженерный парадокс (разрушение моста или вала турбины), создав у студентов проблемный вопрос, на который лекция даёт строгий ответ.", "correct": true}, {"id": "B", "text": "Начать лекцию с 15-минутного строгого диктанта определений под запись.", "correct": false}, {"id": "C", "text": "Поставить на первый слайд абстрактную анимацию и включить громкую динамичную музыку.", "correct": false}, {"id": "D", "text": "Убрать теоретические доказательства и сразу начать решать типовые расчётные задачи из сборника.", "correct": false}], "hints": ["Инженерное мышление активизируется при столкновении с противоречием или реальной аварийной ситуацией.", "ИИ отлично формулирует вводные кейсы «Парадокс — Проблема — Научный закон» на основе инженерной практики."], "explanation": "Академическая драматургия требует создания проблемной ситуации. Показ реального инженерного парадокса (Step 0 Hero-тизер) мотивирует студентов осваивать последующий сложный математический аппарат для объяснения и предотвращения аварии."}, {"id": 4, "badge": "Дидактическое ядро • Архитектура курса", "topic": "Синхронизация слайдов с рабочей программой (РПД)", "situation": "Молодой преподаватель разработал презентации к курсу «Теория электрических цепей». Слайды получились яркими, но на экзамене выяснилось, что целый блок компетенций по переходным процессам в нелинейных цепях выпал из лекций, так как преподаватель увлёкся визуализацией простых базовых схем постоянного тока.", "question": "Какую процедуру промпт-аудита через ИИ следует внедрить перед созданием набора презентаций?", "options": [{"id": "A", "text": "Загрузить в контекст ИИ утверждённую РПД и ФОС курса, сформировав матрицу трассировки: каждый смысловой модуль презентации должен строго закрывать конкретный планируемый результат обучения.", "correct": true}, {"id": "B", "text": "Добавить во все презентации одинаковый список рекомендуемой литературы на 20 слайдов.", "correct": false}, {"id": "C", "text": "Поручить ИИ генерировать темы презентаций исключительно по трендам в социальных сетях.", "correct": false}, {"id": "D", "text": "Отказаться от РПД и читать только тот материал, который легко генерируется ИИ без формул.", "correct": false}], "hints": ["Университетский курс — это нормативно связанная система результатов обучения и оценочных средств.", "ИИ позволяет сопоставить содержание будущих слайдов с дескрипторами компетенций из кафедральной программы."], "explanation": "Матрица трассировки (Traceability Matrix) между РПД, материалами лекций и экзаменационными билетами (ФОС) исключает пробелы в подготовке студентов и гарантирует полное раскрытие образовательной программы."}, {"id": 5, "badge": "Дидактическое ядро • Когнитивная нагрузка", "topic": "Теория двойного кодирования Майера", "situation": "На слайде лекции по деталям машин преподаватель разместил 3D-модель планетарного редуктора и одновременно поместил рядом 3 абзаца текста, слово в слово дублирующих речь лектора. Студенты признались, что не успевали одновременно читать текст на экране и слушать голос преподавателя.", "question": "В чём заключается суть принципа модальности (Modality Principle) теории мультимедийного обучения Ричарда Майера?", "options": [{"id": "A", "text": "Графический визуальный ряд на экране должен сопровождаться устным комментарием лектора, а не дублирующим его сплошным наэкранным текстом, чтобы не перегружать зрительный когнитивный канал.", "correct": true}, {"id": "B", "text": "На слайде обязательно должен быть полный транскрипт каждого произносимого слова лектора.", "correct": false}, {"id": "C", "text": "Все слайды инженерных лекций должны быть строго чёрно-белыми без использования цвета.", "correct": false}, {"id": "D", "text": "Лектор должен молчать во время показа слайдов, давая студентам 5 минут на самостоятельное чтение.", "correct": false}], "hints": ["Человек имеет два независимых канала восприятия: визуальный (глаза) и аудиальный (слух).", "Чтение наэкранного текста и просмотр чертежа одновременно перегружают один и тот же зрительный канал."], "explanation": "Принцип модальности Ричарда Майера гласит: информация усваивается глубже, когда визуальный материал (чертёж, график, схема) комментируется голосом, а на экране остаются лишь краткие опорные маркеры и ключевые формулы."}, {"id": 6, "badge": "Дидактическое ядро • Структурирование", "topic": "Квантование по принципу «Пирамиды Минто»", "situation": "При подготовке лекции по микропроцессорным системам преподаватель изложил материал хронологически: 40 минут рассказывал о транзисторах 1970-х годов и второстепенных инженерных тупиках, и лишь на последних 5 минутах упомянул архитектуру современных RISC-V процессоров, вынесенную в тему занятия.", "question": "Как структурировать инженерный учебный материал с помощью ИИ по принципу пирамиды Барбары Минто?", "options": [{"id": "A", "text": "Сначала сформулировать главную архитектурную концепцию и целевой вывод (Top-Down), затем раскрыть поддерживающие логические блоки и лишь в конце подкрепить их расчётными деталями.", "correct": true}, {"id": "B", "text": "Излагать материал строго в порядке публикации исторических патентов от древнейших к новым.", "correct": false}, {"id": "C", "text": "Разместить вывод лекции в скрытом приложении к презентации без показа на экране.", "correct": false}, {"id": "D", "text": "Случайно перемешать слайды для повышения концентрации студентов.", "correct": false}], "hints": ["Принцип Пирамиды Минто требует движения от ключевого вывода к аргументам, а не наоборот.", "Студенту инженерного факультета важно сразу понимать архитектурную цель изучаемой системы."], "explanation": "Принцип Пирамиды Минто (Top-Down) формирует у студентов целостное понимание: сначала даётся генеральная архитектура системы и итоговый тезис, а затем структурированные аргументы и технические подробности."}, {"id": 7, "badge": "Инженерная вёрстка • Архитектура экрана", "topic": "Закон трёх элементов и когнитивный лимит", "situation": "На слайде по микроконтроллерам одновременно выведены: распиновка чипа на 64 вывода, фрагмент кода на Си из 50 строк, блок-схема прерываний и таблица регистров таймера. Студенты растеряны и не понимают, на какую часть экрана указывает преподаватель.", "question": "Какое правило компоновки экрана является эталонным для лекционного слайда инженерного факультета?", "options": [{"id": "A", "text": "Правило когнитивного кванта: не более 3 ключевых смысловых зон (колонок/карточек) на экране с чёткой визуальной доминантой и последовательным (пошаговым) появлением.", "correct": true}, {"id": "B", "text": "Принцип максимального заполнения: не оставлять ни одного квадратного сантиметра свободного пространства на слайде.", "correct": false}, {"id": "C", "text": "Размещение всех графиков и схем исключительно в правом нижнем углу слайда размером 5х5 см.", "correct": false}, {"id": "D", "text": "Использование не менее 8 различных ярких шрифтов для привлечения внимания аудитории.", "correct": false}], "hints": ["Оперативная память человека способна удерживать в фокусе лишь 3–4 информационных блока.", "Свободное пространство («воздух») является важнейшим элементом визуальной иерархии."], "explanation": "Закон трёх элементов ограничивает плотность экрана: 1 главный акцент (схема или вывод формулы) и 2 поддерживающие карточки. Это позволяет удерживать коллективное внимание аудитории в темпе повествования лектора."}, {"id": 8, "badge": "Математическая типографика • LaTeX", "topic": "Стандарты набора уравнений и размерностей", "situation": "Ассистент кафедры теоретической физики вставил формулу Шрёдингера на слайд скриншотом низкого разрешения из отсканированной книги 1985 года. На экране проектора формульные индексы размылись в серые пятна, знак частной производной слился с буквой 'd', а знаки минуса исчезли.", "question": "Каким технологическим стандартом оформления математического аппарата обязан владеть преподаватель вуза при работе с ИИ?", "options": [{"id": "A", "text": "Генерация формул строго в векторном синтаксисе LaTeX (MathJax / KaTeX) с корректной группировкой скобок, прямым начертанием индексов и изолированным выводом ключевых этапов доказательства.", "correct": true}, {"id": "B", "text": "Фотографирование рукописных выкладок на камеру смартфона под косым углом с последующей вставкой в JPG.", "correct": false}, {"id": "C", "text": "Набор формул обычными буквами в одну строчку через пробелы и слеши (например: y = a/b + c^2/d_1).", "correct": false}, {"id": "D", "text": "Замена формул словесным описанием интегралов без математических знаков.", "correct": false}], "hints": ["Векторный рендеринг LaTeX масштабируется до любых экранов и разрешений 4K без пикселизации.", "Нейросети превосходно генерируют безошибочный KaTeX/LaTeX код по формульному описанию или фото."], "explanation": "Использование LaTeX для математической типографики гарантирует идеальную чёткость на любых проекторах и экранах, правильные отступы операторов, различимость надстрочных/подстрочных индексов и строгое соблюдение академических типографских стандартов."}, {"id": 9, "badge": "Векторная графика • Архитектура схем", "topic": "Mermaid и SVG против растровых скриншотов", "situation": "Преподаватель курса «Программная инженерия» объясняет архитектуру микросервисного взаимодействия. Он вставил растровую диаграмму из презентации пятилетней давности. При изменении требований к протоколам шины данных ему приходится заново перерисовывать всю картинку в стороннем графическом редакторе.", "question": "Какое преимущество даёт генерация диаграмм через ИИ в формате кода (Mermaid / PlantUML / SVG)?", "options": [{"id": "A", "text": "Диаграмма в виде текстового кода (Diagram-as-Code) редактируется за секунды текстовым промптом, хранится в репозитории Git и идеально рендерится в браузере и на слайдах без пикселизации.", "correct": true}, {"id": "B", "text": "Код Mermaid автоматически блокирует возможность копирования диаграммы студентами.", "correct": false}, {"id": "C", "text": "Текстовые диаграммы поддерживают только прямоугольники и запрещают стрелки между узлами.", "correct": false}, {"id": "D", "text": "Mermaid требует подключения квантового сопроцессора для вывода схемы.", "correct": false}], "hints": ["Принцип «Диаграмма как код» позволяет обновлять схему простой правкой текста в репозитории.", "ИИ умеет мгновенно трансформировать текстовое описание алгоритма в синтаксис Mermaid/SVG."], "explanation": "Подход Diagram-as-Code (Mermaid, PlantUML, чистый SVG) превращает визуальные схемы в программные артефакты: их можно версионировать в Git, мгновенно модифицировать через промпты нейросети и выводить в векторном качестве на любом устройстве."}, {"id": 10, "badge": "Инженерная вёрстка • Доступность и цвет", "topic": "Стандарт WCAG и контрастность в поточной аудитории", "situation": "Лекция проходит в светлой аудитории с выгоревшим проектором. Преподаватель оформил слайды светло-серым текстом на белом фоне с тонкими жёлтыми стрелками на схемах. Студенты с 5-го ряда и дальше вообще не видят линий на графиках и надписей к осям.", "question": "Каким базовым правилам колористики и стандарта доступности (WCAG 2.1) должны следовать лекционные слайды?", "options": [{"id": "A", "text": "Обеспечение коэффициента контрастности текста к фону не менее 4.5:1 (для крупного текста — не менее 3:1), использование толщины линий графиков не менее 2–3px и отказ от кодирования информации исключительно цветом.", "correct": true}, {"id": "B", "text": "Использование не менее 12 пастельных оттенков на каждом графике для создания мягкой атмосферы.", "correct": false}, {"id": "C", "text": "Применение кислотно-зелёного шрифта на чёрном фоне с эффектом мерцания.", "correct": false}, {"id": "D", "text": "Отключение проектора и демонстрация графиков исключительно на экране ноутбука лектора.", "correct": false}], "hints": ["Реальный проектор в университетской аудитории часто имеет в 2–3 раза меньшую контрастность, чем монитор дизайнера.", "Стандарт WCAG гарантирует читаемость контента даже для студентов с ослабленным зрением."], "explanation": "Условия показа в вузовских аудиториях (засветка от окон, износ лампы проектора) требуют строгого соблюдения контраста (не менее 4.5:1), плотных линий чертежей и дублирования цветовых обозначений текстовыми подписями или типами штриховки."}, {"id": 11, "badge": "Инженерная вёрстка • Пошаговая динамика", "topic": "Техника Progressive Reveal (Пошаговое появление)", "situation": "На слайде доказательства теоремы об устойчивости автоматических систем одновременно открыты все 12 строк математических преобразований. Пока лектор объясняет физический смысл первой строки, студенты читают последнюю строку, отвлекаются, задают несвоевременные вопросы и теряют общую логику доказательства.", "question": "Как пошаговое раскрытие информации (Progressive Reveal) решает проблему рассинхронизации внимания?", "options": [{"id": "A", "text": "Вывод каждого шага формулы или элемента схемы синхронно со словесным объяснением преподавателя удерживает фокус всей аудитории на текущем мыслительном действии, исключая распыление внимания.", "correct": true}, {"id": "B", "text": "Пошаговое раскрытие заставляет студентов дольше сидеть на паре из-за медленной анимации.", "correct": false}, {"id": "C", "text": "Каждый шаг формулы требует перезагрузки всей операционной системы проектора.", "correct": false}, {"id": "D", "text": "Данный метод применяется исключительно в детских садах и запрещён в университетах.", "correct": false}], "hints": ["Когда студент видит весь экран сразу, его взгляд хаотично блуждает по итоговым результатам.", "Пошаговый показ воспроизводит естественную логику работы профессора у классической меловой доски."], "explanation": "Метод Progressive Reveal воспроизводит лучшее дидактическое свойство классической лекции у доски: студент проходит логическую цепочку вместе с преподавателем шаг за шагом, осмысливая каждый переход до появления следующего вывода."}, {     const SESSION_COUNT = 7;

    // Session State
    let sessionQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let currentAttempts = 0;
    let userHistory = [];
    let isSpeaking = false;

    // Shuffle options using Fisher-Yates and assign fresh letter IDs (A, B, C, D)
    function shuffleOptions(options) {
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const cloned = options.map(o => ({ text: o.text, correct: !!o.correct }));
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned.map((o, idx) => ({
        id: letters[idx] || String.fromCharCode(65 + idx),
        text: o.text,
        correct: o.correct
      }));
    }

    // Shuffle and pick 7 questions for this session with freshly randomized answer choices
    function startNewSession() {
      const shuffled = [...FULL_QUESTION_BANK].sort(() => 0.5 - Math.random());
      sessionQuestions = shuffled.slice(0, SESSION_COUNT).map(q => ({
        ...q,
        options: shuffleOptions(q.options)
      }));
      currentIdx = 0;
      score = 0;
      userHistory = [];
      renderQuestion();
    }

          </div>

          <div class="options-grid" id="optionsGrid">
            ${q.options.map((opt, i) => `
              <button class="option-btn" id="opt_${opt.id}" onclick="handleSelect('${opt.id}')">
                <span class="option-letter">${opt.id}</span>
                <span>${opt.text}</span>
              </button>
            `).join('')}
          </div>

          <div id="hintContainer" style="display: none;"></div>
          <div id="explainContainer" style="display: none;"></div>

          <div class="quiz-footer" id="footerActions" style="display: none;">
            <div id="roundResultText" style="font-size: 15px;"></div>
            <button class="btn btn-primary" onclick="handleNextQuestion()" style="padding: 12px 24px;">
              <span>${currentIdx === SESSION_COUNT - 1 ? 'Завершить практикум ★' : 'Следующий кейс →'}</span>
            </button>
          </div>
        </div>
      `;

      markCurrentContext();
    }

    function handleSelect(chosenId) {
      const q = sessionQuestions[currentIdx];
      const opt = q.options.find(o => o.id === chosenId);
      if (!opt) return;

      currentAttempts++;
      const optBtn = document.getElementById(`opt_${chosenId}`);
      const attemptDisplay = document.getElementById('attemptDisplay');
      if (attemptDisplay) attemptDisplay.innerText = Math.min(currentAttempts + 1, 3);

      if (opt.correct) {
        optBtn.classList.add('correct');
        disableAllOptions();

        let earned = 3; if (currentAttempts === 2) earned = 2; if (currentAttempts >= 3) earned = 1;
        score += earned;
        document.getElementById('currentScore').innerText = score;

        showExplanation(q, true, earned);
      } else {
        optBtn.classList.add('wrong');
        optBtn.disabled = true;

        if (currentAttempts === 1) {
          showHint(q.hints[0], 1);
        } else if (currentAttempts === 2) {
          showHint(q.hints[1] || q.hints[0], 2);
        } else {
          // 3 attempts exhausted
          disableAllOptions();
          const correctOpt = q.options.find(o => o.correct);
          if (correctOpt) {
            const cBtn = document.getElementById(`opt_${correctOpt.id}`);
            if (cBtn) cBtn.classList.add('correct');
          }
          showExplanation(q, false, 0);
        }
      }
    }

    function disableAllOptions() {
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
    }

    function showHint(text, hintNum) {
      const box = document.getElementById('hintContainer');
      box.style.display = 'flex';
      box.className = 'hint-box';
      box.innerHTML = `
        <span style="font-size: 24px;">💡</span>
        <div>
          <strong>Подсказка ${hintNum}:</strong> ${text}
        </div>
      `;
    }

    function showExplanation(q, isPassed, earned) {
      const explainBox = document.getElementById('explainContainer');
      explainBox.style.display = 'flex';
      explainBox.className = 'explain-box';
      explainBox.innerHTML = `
        <div class="explain-title">
          <span>${isPassed ? '✓ Верно! Методический разбор:' : '❌ Разбор ситуации:'}</span>
          <button class="btn-audio-speak" id="speakExpBtn" onclick="toggleSpeakExplanation()" title="Озвучить методический разбор">
            🔊 Озвучить разбор
          </button>
        </div>
        <div class="explain-text" id="explainTextContent">
          ${q.explanation}
        </div>
      `;

      // Footer
      const footer = document.getElementById('footerActions');
      footer.style.display = 'flex';
      const roundText = document.getElementById('roundResultText');
      if (isPassed) {
        const suffix = earned === 1 ? '\u0431\u0430\u043B\u043B' : '\u0431\u0430\u043B\u043B\u0430'; roundText.innerHTML = `<span style="color: #22c55e; font-weight: 700;">+${earned} ${suffix}</span> (\u043F\u043E\u043F\u044B\u0442\u043A\u0430: ${currentAttempts})`;
      } else {
        roundText.innerHTML = `<span style="color: #f87171; font-weight: 700;">0 баллов</span> (использованы все 3 попытки)`;
      }

      userHistory.push({
        badge: q.badge,
        question: q.question,
        earned: earned,
        attempts: currentAttempts,
        passed: isPassed
      });
    }

    function handleNextQuestion() {
      if (currentIdx < SESSION_COUNT - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      stopSpeech();
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('stepCounter').innerText = 'Практикум завершён!';

      const maxScore = SESSION_COUNT * 3;
      const pct = Math.round((score / maxScore) * 100);

      let trophy = '🎓';
      let title = 'Базовый уровень освоения';
      if (pct >= 85) {
        trophy = '🏆';
        title = 'Эксперт инструментов и методов ИИ';
      } else if (pct >= 65) {
        trophy = '⭐';
        title = 'Уверенный преподаватель-практик';
      }

      // Save completion status
      try {
        localStorage.setItem('ai_course_l6_p4_completed', 'true');
      } catch(e) {}

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="results-card">
          <div class="trophy-icon">${trophy}</div>
          <h1 style="font-size: 34px; font-weight: 900; color: #fff;">${title}</h1>
          <p style="font-size: 19px; color: #94a3b8; max-width: 650px; line-height: 1.5;">
            Вы завершили интерактивный практикум Урока 6. Знания декомпозиции методичек, извлечения дидактического ядра, LaTeX-типографики, векторных схем, WCAG-контраста и Git-версионирования слайдов успешно закреплены.
          </p>

          <div style="background: rgba(56, 189, 248, 0.12); border: 2px solid #38bdf8; border-radius: 20px; padding: 20px 40px; margin: 8px 0;">
            <div style="font-size: 48px; font-weight: 900; color: #38bdf8; font-family: 'JetBrains Mono', monospace;">
              ${score} / ${maxScore}
            </div>
            <div style="font-size: 16px; color: #cbd5e1; font-weight: 700;">${pct}% успешных ответов</div>
          </div>

          <div style="width: 100%; max-width: 700px; text-align: left; background: rgba(3, 7, 18, 0.5); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.08);">
            <div style="font-size: 16px; font-weight: 800; color: #38bdf8; margin-bottom: 12px;">📊 Детализация по темам сессии:</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${userHistory.map((h, i) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; font-size: 15px;">
                  <span>${i+1}. <strong>${h.badge}</strong></span>
                  <span style="font-weight: 700; color: ${h.passed ? '#4ade80' : '#f87171'};">
                    ${h.earned} б. (${h.attempts} ${h.attempts===1?'попытка':'попытки'})
                  </span>
                </div>
              `).join('')}
            </div>
          </div>

          <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 12px;">
            <button class="btn btn-primary" onclick="startNewSession()" style="padding: 14px 26px; font-size: 16px;">
              🔄 Пройти другой вариант (7 новых вопросов из банка 18)
            </button>
            <button class="btn" onclick="copyProtocol()" style="padding: 14px 20px;">
              📋 Скопировать протокол
            </button>
            <a href="index.html" class="btn" style="padding: 14px 20px;">
              К программе курса
            </a>
          </div>
        </div>
      `;
    }

    function copyProtocol() {
      let text = '=== ПРОТОКОЛ ТЕСТИРОВАНИЯ: КУРС ПО ИИ (УРОК 6: ОТ МЕТОДИЧКИ К ПРЕЗЕНТАЦИИ — СЛАЙД-ИНЖЕНЕРИЯ) ===\n';
      text += `Итоговый результат: ${score} из ${SESSION_COUNT * 3} баллов\n`;
      text += `Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;
      userHistory.forEach((h, i) => {
        text += `${i+1}. ${h.badge}: ${h.earned} б. (попыток: ${h.attempts})\n`;
      });
      text += '==================================================';
      navigator.clipboard.writeText(text).then(() => alert('Протокол скопирован в буфер!'));
    }

    // Speech Synthesis
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const qBtn = document.getElementById('speakQBtn');
      if (qBtn) qBtn.innerText = '🔊 Озвучить';
      const expBtn = document.getElementById('speakExpBtn');
      if (expBtn) expBtn.innerText = '🔊 Озвучить разбор';
    }

    function toggleSpeakQuestion() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      const textToSpeak = `${q.situation}. Вопрос: ${q.question}`;
      speakText(textToSpeak, 'speakQBtn');
    }

    function toggleSpeakExplanation() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      const q = sessionQuestions[currentIdx];
      speakText(q.explanation, 'speakExpBtn');
    }

    function speakText(text, btnId) {
      if (!('speechSynthesis' in window)) {
        alert('Синтез речи не поддерживается браузером.');
        return;
      }
      stopSpeech();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      utter.onend = () => stopSpeech();
      utter.onerror = () => stopSpeech();

      isSpeaking = true;
      const btn = document.getElementById(btnId);
      if (btn) btn.innerText = '⏹ Остановить';
      window.speechSynthesis.speak(utter);
    }

    // Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleReviewerDrawer() {}
    window.addEventListener('keydown', (e) => {
      
      if ((e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Initialize session on load
    window.addEventListener('DOMContentLoaded', () => {
      startNewSession();
      // updateNotesBadge();
    });
  </script>
</body>
</html>
